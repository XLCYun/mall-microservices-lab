<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta
      name="description"
      content="在一场商城大促中动手演练服务发现、网关限流、扩缩容、容错、接口测试与灰度发布。可完全离线使用。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236451d9'/%3E%3Cpath d='m5 12 11-6 11 6-11 7Z' fill='%23e5dcff'/%3E%3Cpath d='m5 14 10 6v7L5 21Z' fill='%23ada3ff'/%3E%3Cpath d='m27 14-10 6v7l10-6Z' fill='%237fecce'/%3E%3C/svg%3E"
    />
    <title>商城大促值班夜 · 微服务演练场</title>
    <!-- STYLES -->
  </head>
  <body>
    <a class="skip-link" href="#scene-title">跳到当前场景</a>
    <header class="mast">
      <div class="wrap mast-inner">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true"><i></i><b></b><em></em></span><span>微服务演练场</span>
        </div>
        <span class="course">高级软件工程课程实践</span>
        <div class="mast-actions">
          <button type="button" data-shell="catalog"><span data-icon="grid"></span>剧情目录</button
          ><button type="button" data-shell="fullscreen">
            <span data-icon="expand"></span><span id="fullscreen-label">全屏演示</span>
          </button>
        </div>
      </div>
    </header>
    <main class="wrap" id="main">
      <section class="scene-intro" aria-labelledby="scene-title">
        <div class="intro-copy">
          <div class="storyline">
            <span class="series-mark"></span>商城大促值班夜<span class="story-separator">/</span
            ><span id="act-number"></span>
          </div>
          <h1 id="scene-title" tabindex="-1"></h1>
          <p id="story-text"></p>
        </div>
        <div class="episode-tools">
          <div class="episode-time">
            <span class="time-glyph" data-icon="clock"></span>
            <div><span>剧情时间</span><strong id="story-clock"></strong></div>
          </div>
          <button type="button" data-shell="next" id="quick-next">下一幕</button>
        </div>
      </section>
      <nav class="chapter-rail" id="chapter-rail" aria-label="切换场景"></nav>
      <div class="studio">
        <div class="main-col">
          <section id="stage-card" class="stage-card" aria-labelledby="stage-title">
            <div class="stage-head">
              <h2><span data-icon="layers"></span><span id="stage-title">服务拓扑</span></h2>
              <div class="stage-status"><i></i><span id="stage-status">已暂停</span></div>
            </div>
            <div class="canvas-box" id="canvas-box">
              <canvas id="topology" aria-label="服务拓扑与流量动画">可从运行明细查看节点和请求分布。</canvas>
              <div class="stage-legend" id="legend"></div>
            </div>
            <div id="workspace" class="workspace" hidden></div>
            <div class="transport">
              <div class="transport-actions">
                <button type="button" data-shell="play" class="play-button" id="play-button"></button
                ><button type="button" data-shell="step" class="transport-button">
                  <span data-icon="step"></span><span>单步</span></button
                ><button type="button" data-shell="reset" class="transport-button">
                  <span data-icon="reset"></span><span>重置本幕</span>
                </button>
              </div>
              <div class="clock-tools">
                <span id="sim-clock" title="模拟经过的时间">00:00</span
                ><select id="speed" aria-label="播放速度">
                  <option value="1">1×</option>
                  <option value="2">2×</option>
                  <option value="4">4×</option>
                </select>
              </div>
            </div>
          </section>
          <div class="metrics" id="metrics" aria-label="当前指标"></div>
          <section id="detail-card" class="paper-card detail-card">
            <div class="section-title">
              <span data-icon="list"></span>
              <h2>运行明细</h2>
            </div>
            <div id="scene-detail"></div>
          </section>
        </div>
        <aside class="side-col">
          <section class="paper-card controls-card">
            <div class="section-title">
              <span data-icon="panels"></span>
              <h2>场景控制</h2>
            </div>
            <div class="mission">
              <span data-icon="mission"></span>
              <div>
                <strong>本幕任务</strong>
                <p id="mission"></p>
              </div>
            </div>
            <div id="scene-controls"></div>
          </section>
          <section class="paper-card record-card">
            <div class="section-title">
              <span data-icon="pencil"></span>
              <h2>课堂记录</h2>
            </div>
            <label for="answer" id="question"></label
            ><textarea id="answer" rows="2" maxlength="500" placeholder="写下你的观察……"></textarea
            ><button type="button" id="record-button" data-shell="record">
              <span data-icon="image"></span>生成结果卡</button
            ><span class="record-state" id="record-state"></span>
          </section>
        </aside>
      </div>
      <div class="episode-nav">
        <span id="lesson-pages"></span>
        <div>
          <button type="button" class="prev" data-shell="prev">上一幕</button
          ><button type="button" class="next" data-shell="next" id="next-button">下一幕</button>
        </div>
      </div>
    </main>
    <footer class="wrap footer">
      <span>高级软件工程 · 服务治理与测试</span
      ><a id="offline" download="商城大促值班夜.html"><span data-icon="download"></span>下载离线版</a>
    </footer>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button type="button" data-shell="close" aria-label="关闭" class="icon-button">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <!-- SCRIPTS -->
  </body>
</html>
