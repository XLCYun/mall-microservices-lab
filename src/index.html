<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta
      name="description"
      content="在一场商城大促中动手演练服务发现、网关限流、扩缩容、容错、灰度发布、数据驱动测试与契约测试。可完全离线使用。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236451d9'/%3E%3Cpath d='m5 12 11-6 11 6-11 7Z' fill='%23e5dcff'/%3E%3Cpath d='m5 14 10 6v7L5 21Z' fill='%23ada3ff'/%3E%3Cpath d='m27 14-10 6v7l10-6Z' fill='%237fecce'/%3E%3C/svg%3E"
    />
    <title>商城大促值班夜 · 微服务演练场</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./registry.css" />
    <link rel="stylesheet" href="./registry-origin.css" />
    <link rel="stylesheet" href="./registry-map-slides.css" />
    <link rel="stylesheet" href="./lessons.css" />
    <link rel="stylesheet" href="./phone.css" />
    <link rel="stylesheet" href="./contract.css" />
  </head>
  <body>
    <a class="skip-link" href="#scene-heading">跳到当前场景</a>
    <header class="mast">
      <div class="wrap mast-inner">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true"><i></i><b></b><em></em></span><span>微服务演练场</span>
        </div>
        <span class="course">高级软件工程课程实践</span>
        <nav class="topic-nav" id="topic-nav" aria-label="课程分组"></nav>
        <button type="button" class="fullscreen-button" data-shell="fullscreen">
          <span data-icon="expand"></span><span id="fullscreen-label">全屏演示</span>
        </button>
      </div>
    </header>
    <main class="wrap" id="main">
      <nav class="chapter-rail" id="chapter-rail" aria-label="切换场景"></nav>
      <h1 id="scene-heading" class="visually-hidden" tabindex="-1"></h1>
      <div class="registry-toolbar" id="lesson-toolbar" hidden>
        <div class="registry-modes" role="group" aria-label="演示方式">
          <button type="button" data-shell="show-guide" aria-pressed="true">情景演示</button>
          <button type="button" data-shell="show-free" aria-pressed="false">自由实验</button>
        </div>
        <div class="registry-guide-tools" id="guide-tools">
          <div class="registry-key" id="guide-legend" aria-label="流量图例"></div>
          <button class="registry-reset-all" type="button" data-shell="reset">
            <span data-icon="reset"></span>重置本幕
          </button>
        </div>
      </div>
      <div id="walkthrough-host" hidden></div>
      <div id="scene-studio" class="studio">
        <div class="main-col">
          <div id="testing-overview" hidden></div>
          <section id="stage-card" class="stage-card" aria-labelledby="stage-title">
            <div class="stage-head">
              <h2><span data-icon="layers"></span><span id="stage-title">服务拓扑</span></h2>
              <div class="stage-status"><i></i><span id="stage-status">已暂停</span></div>
            </div>
            <div class="canvas-box" id="canvas-box">
              <canvas id="topology" role="img" aria-label="服务拓扑与流量动画">可从运行明细查看节点和请求分布。</canvas>
              <div class="stage-legend" id="legend"></div>
            </div>
            <div id="stage-inline-controls" class="stage-inline-controls" data-gateway-ui hidden></div>
            <div class="transport" id="transport" data-gateway-ui></div>
          </section>
          <div id="testing-workspace" hidden></div>
          <div class="metrics" id="metrics" aria-label="当前指标"></div>
          <section id="detail-card" class="paper-card detail-card">
            <div class="section-title">
              <span data-icon="list"></span>
              <h2>运行明细</h2>
            </div>
            <div id="scene-detail"></div>
          </section>
        </div>
        <aside class="side-col">
          <section class="paper-card controls-card">
            <div class="section-title">
              <span data-icon="panels"></span>
              <h2>场景控制</h2>
            </div>
            <div class="mission">
              <span data-icon="mission"></span>
              <div>
                <strong>本幕任务</strong>
                <p id="mission"></p>
              </div>
            </div>
            <div id="scene-controls"></div>
            <div id="gateway-controls" data-gateway-ui hidden></div>
          </section>
        </aside>
      </div>
      <div class="episode-nav" hidden>
        <span id="lesson-pages"></span>
        <div>
          <button type="button" class="prev" data-shell="prev">上一幕</button
          ><button type="button" class="next" data-shell="next" id="next-button">下一幕</button>
        </div>
      </div>
    </main>
    <footer class="wrap footer">
      <span>高级软件工程 · 服务治理与测试</span
      ><a id="offline" download="商城大促值班夜.html"><span data-icon="download"></span>下载离线版</a>
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./core.js"></script>
    <script src="./request-flow.js"></script>
    <script src="./story.js"></script>
    <script src="./traffic.js"></script>
    <script src="./registry-frames.js"></script>
    <script src="./resilience.js"></script>
    <script src="./phone.js"></script>
    <script src="./contract.js"></script>
    <script src="./stage.js"></script>
    <script src="./request-balls.js"></script>
    <script src="./assets/gateway-ui.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
