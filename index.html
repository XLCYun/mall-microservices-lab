  }

  function run(row) {
    row.actual = serviceAccepts(row.raw);
  }

  function tick(s) {
    const next = s.rows.find(row => row.actual === null);
    if (next) run(next);
    return Boolean(next);
  }

  function validity(value) {
    return value ? '有效' : '无效';
  }

  function verdict(row) {
    if (row.actual === null) return '待运行';
    return row.expected === row.actual ? '通过' : '失败';
  }

  function visibleRaw(raw) {
    if (raw === '') return '空字符串';
    return raw.replace(/ /g, '␠').replace(/\t/g, '⇥').replace(/\r/g, '␍').replace(/\n/g, '↵');
  }

  function preview(text, limit) {
    const chars = Array.from(text);
    if (chars.length <= limit) return text;
    const tail = 6;
    return chars.slice(0, limit - tail).join('') + '…' + chars.slice(-tail).join('');
  }

  function escape(value) {
    return Lab.ui.escape(String(value));
  }

  function readRecords(source) {
    const csv = String(source).replace(/^\uFEFF/, '');
    const records = [];
    let record = [];
    let field = '';
    let quoted = false;
    let closedQuote = false;
    let started = false;

    function endField() {
      record.push(field);
      field = '';
      closedQuote = false;
    }

    function endRecord() {
      if (started) {
        endField();
        records.push(record);
      }
      record = [];
      started = false;
    }

    for (let i = 0; i < csv.length; i++) {
      const char = csv[i];
      if (quoted) {
        if (char !== '"') field += char;
        else if (csv[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          quoted = false;
          closedQuote = true;
        }
      } else if (char === ',') {
        started = true;
        endField();
      } else if (char === '\r' || char === '\n') {
        endRecord();
        if (char === '\r' && csv[i + 1] === '\n') i++;
      } else {
        started = true;
        if (closedQuote) throw new Error('结束引号后需要逗号或换行。');
        if (char === '"') {
          if (field) throw new Error('字段里的引号需要写成两个双引号，并给整个字段加引号。');
          quoted = true;
        } else field += char;
      }
    }
    if (quoted) throw new Error('有一个带引号的字段缺少结束引号。');
    endRecord();
    return records;
  }

  function importedExpectation(value, recordNumber) {
    const normalized = value.trim().toLowerCase();
    if (['有效', '合法', 'valid', 'true', '1'].includes(normalized)) return true;
    if (['无效', '不合法', 'invalid', 'false', '0'].includes(normalized)) return false;
    throw new Error('第 ' + recordNumber + ' 条记录的预期请填“有效”或“无效”。');
  }

  function importRecords(text) {
    const [first, ...records] = readRecords(text);
    if (!first) throw new Error('文件是空的。');
    const columns = first.map(cell => cell.trim().toLowerCase());
    const locate = key => columns.findIndex(column => headers[key].includes(column));
    const name = locate('name');
    const raw = locate('raw');
    const expected = locate('expected');
    if (raw < 0 || expected < 0) throw new Error('表头需要包含“输入原文”和“预期校验结果”。');
    if (records.length === 0) throw new Error('表头下面还没有测试用例。');
    return records.map((record, i) => {
      const number = i + 2;
      if (raw >= record.length || expected >= record.length) {
        throw new Error('第 ' + number + ' 条记录缺少输入或预期列。');
      }
      return {
        name: name >= 0 && name < record.length ? record[name] : '导入用例 ' + (i + 1),
        raw: record[raw],
        expected: importedExpectation(record[expected], number)
      };
    });
  }

  function csvFor(s) {
    const fields = [['用例', '输入原文', '预期校验结果', '实际校验结果', '用例结果']];
    for (const row of s.rows) {
      fields.push([row.name, row.raw, validity(row.expected),
        row.actual === null ? '' : validity(row.actual), verdict(row)]);
    }
    const quote = value => '"' + value.replace(/"/g, '""') + '"';
    return '\uFEFF' + fields.map(record => record.map(quote).join(',')).join('\r\n') + '\r\n';
  }

  function fileText(file) {
    if (typeof file.text === 'function') return file.text();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('读取文件时发生错误，请重新选择文件。'));
      reader.readAsText(file, 'UTF-8');
    });
  }

  async function importFile(s, target, ctx) {
    const file = target && target.files && target.files[0];
    if (!file) return;
    try {
      const records = importRecords(await fileText(file));
      for (const row of records) append(s, row.name, row.raw, row.expected);
      s.importNote = '已追加 ' + records.length + ' 条用例，等待运行。';
      s.importError = false;
    } catch (error) {
      s.importNote = '导入失败。' + error.message;
      s.importError = true;
    }
    target.value = '';
    ctx.notify(s.importNote);
  }

  function act(s, key, value, target, ctx) {
    const edit = /^phone-(raw|name|expected)-(\d+)$/.exec(key);
    if (edit) {
      const row = s.rows.find(item => item.id === Number(edit[2]));
      if (!row) return;
      if (edit[1] === 'raw' && row.raw !== value) {
        row.raw = String(value);
        row.actual = null;
      } else if (edit[1] === 'expected') {
        row.expected = value === 'valid';
      } else if (edit[1] === 'name') row.name = String(value);
      return;
    }

    switch (key) {
      case 'phone-signup-raw':
        s.signupRaw = String(value);
        s.signupLastId = null;
        break;
      case 'phone-signup-expected':
        s.signupExpected = value === 'valid';
        s.signupLastId = null;
        break;
      case 'phone-signup':
        {
          const row = append(s, '注册表单', s.signupRaw, s.signupExpected);
          run(row);
          s.signupLastId = row.id;
        }
        break;
      case 'phone-all':
        s.rows.forEach(run);
        break;
      case 'phone-add':
        append(s, '自定义用例', '', false);
        ctx.notify('已在表尾加入一条空用例，可填写名称、输入和预期。');
        break;
      case 'phone-run':
        {
          const row = s.rows.find(item => item.id === Number(value));
          if (row) run(row);
        }
        break;
      case 'phone-remove':
        s.rows = s.rows.filter(row => row.id !== Number(value));
        if (s.signupLastId === Number(value)) s.signupLastId = null;
        break;
      case 'phone-preset':
        s.preset = String(value);
        break;
      case 'phone-add-preset':
        {
          const sample = samples.find(item => item.key === s.preset);
          if (sample) {
            append(s, sample.name, sample.raw, sample.expected);
            ctx.notify('已加入“' + sample.name + '”用例。');
          }
        }
        break;
      case 'phone-import':
        return importFile(s, target, ctx);
      case 'phone-export':
        ctx.download('商城手机号测试用例.csv', csvFor(s), 'text/csv;charset=utf-8');
        break;
    }
  }

  function option(value, label, selected) {
    return '<option value="' + escape(value) + '"' + (selected ? ' selected' : '') + '>' +
      escape(label) + '</option>';
  }

  function expectation(key, expected, label) {
    return '<select class="phone-input phone-select" data-key="' + key + '" aria-label="' +
      escape(label) + '">' + option('valid', '有效', expected) + option('invalid', '无效', !expected) + '</select>';
  }

  function rawEditor(key, raw, label) {
    const attrs = ' class="phone-input phone-raw" data-key="' + key + '" aria-label="' +
      escape(label) + '" autocomplete="off" autocapitalize="off" spellcheck="false"';
    if (/[\r\n]/.test(raw)) {
      return '<textarea rows="2"' + attrs + '>\n' + escape(raw) + '</textarea>';
    }
    return '<input type="text" inputmode="text"' + attrs + ' value="' + escape(raw) +
      '" placeholder="空字符串">';
  }

  function registration(s) {
    const last = s.rows.find(row => row.id === s.signupLastId);
    const current = last && last.actual !== null && last.raw === s.signupRaw &&
      last.expected === s.signupExpected;
    const response = current
      ? '<p class="phone-signup-feedback" role="status"><strong>' +
        (last.actual ? '允许继续注册' : '已拒绝这个号码') + '</strong><span>已记入用例 #' +
        last.id + ' · ' + verdict(last) + '</span></p>'
      : '<p class="phone-signup-feedback">提交后，这次注册尝试会出现在下方测试表中。</p>';
    return '<section class="phone-signup" aria-label="商城注册表单">' +
      '<header class="phone-signup-title"><span class="phone-shop-mark" aria-hidden="true"></span>' +
      '<h3>商城注册页</h3><code>' + servicePath + '</code></header>' +
      '<p class="phone-rule">请输入 11 位半角数字，首位为 1，第二位为 3–9。空格也算输入。</p>' +
      '<div class="phone-signup-fields"><label class="phone-form-raw"><span>手机号</span>' +
      rawEditor('phone-signup-raw', s.signupRaw, '注册表单手机号原文') + '</label>' +
      '<label class="phone-form-expected"><span>我的预期</span>' +
      expectation('phone-signup-expected', s.signupExpected, '注册表单预期校验结果') + '</label>' +
      '<button type="button" class="phone-btn phone-btn-primary" data-act="phone-signup">提交校验</button></div>' +
      response + '</section>';
  }

  function rawInfo(raw) {
    const length = Array.from(raw).length;
    const whitespace = /[ \t\r\n]/.test(raw);
    const shown = whitespace ? ' · ' + escape(preview(visibleRaw(raw), 35)) : '';
    return '<span class="phone-raw-info">' + length + ' 个字符' + shown + '</span>';
  }

  function caseRow(row) {
    const id = row.id;
    const label = '用例 #' + id;
    const outcome = verdict(row);
    let note = '';
    if (row.actual !== null) {
      if (defectFor(row)) note = '接口误收';
      else if (row.expected !== matchesSpec(row.raw)) note = '请核对预期';
    }
    const state = row.actual === null ? 'pending' : row.expected === row.actual ? 'pass' : 'fail';
    const actual = row.actual === null ? '—' : validity(row.actual);
    return '<tr><td class="phone-case-data"><div class="phone-case-title">' +
      '<span class="phone-case-id" title="用例编号">#' + id + '</span>' +
      '<input type="text" class="phone-name" data-key="phone-name-' + id + '" aria-label="' + label +
      '名称" value="' + escape(row.name) + '" autocomplete="off" placeholder="用例名称"></div>' +
      rawEditor('phone-raw-' + id, row.raw, label + '输入原文') + rawInfo(row.raw) + '</td>' +
      '<td class="phone-case-expect" data-col="预期">' + expectation('phone-expected-' + id, row.expected,
        label + '预期校验结果') + '</td><td class="phone-case-actual" data-col="实际">' + actual + '</td>' +
      '<td class="phone-case-verdict" data-col="用例结果"><span class="phone-verdict phone-' + state + '">' +
      outcome + '</span>' + (note ? '<small class="phone-diagnosis">' + note + '</small>' : '') + '</td>' +
      '<td class="phone-case-actions"><button type="button" class="phone-row-btn" data-act="phone-run" ' +
      'data-value="' + id + '" aria-label="运行' + label + '">运行</button>' +
      '<button type="button" class="phone-row-btn phone-delete" data-act="phone-remove" data-value="' +
      id + '" aria-label="删除' + label + '">删除</button></td></tr>';
  }

  function table(s) {
    const body = s.rows.length ? s.rows.map(caseRow).join('')
      : '<tr><td class="phone-empty" colspan="5">测试表是空的。新增一条用例，或提交上方的注册表单。</td></tr>';
    return '<section class="phone-suite" aria-label="可编辑的手机号测试用例">' +
      '<header class="phone-suite-head"><h3>测试用例 <span>' + s.rows.length + '</span></h3>' +
      '<div class="phone-toolbar"><button type="button" class="phone-btn phone-btn-light" data-act="phone-add">' +
      '新增用例</button><button type="button" class="phone-btn phone-btn-primary" data-act="phone-all"' +
      (s.rows.length ? '' : ' disabled') + '>运行全部</button></div></header>' +
      '<div class="phone-table-wrap"><table class="phone-table"><caption class="phone-sr">每行可以修改用例名称、' +
      '输入原文和预期。实际结果与预期一致时，该用例通过。</caption>' +
      '<thead><tr><th scope="col">用例 / 输入原文</th><th scope="col">预期</th><th scope="col">实际</th>' +
      '<th scope="col">用例结果</th><th scope="col">操作</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<p class="phone-suite-note">实际与预期一致，用例就通过。无效号码被正确拒绝也算通过。</p></section>';
  }

  function workspace(s) {
    return '<div class="phone-lab">' + registration(s) + table(s) + '</div>';
  }

  function controls(s) {
    const { found } = counts(s);
    const hint = !found.has('short') ? '把一个合法号码删去最后一位，运行后对照课堂规则。'
      : !found.has('tail') ? '在合法号码后再添一个字符。换成字母或空格，结果会怎样？'
      : '两类缺陷都已复现。试着修改用例的预期，观察通过数和缺陷数。';
    const observed = [...found].map(key => '<li>' + defects[key] + '</li>').join('');
    return '<div class="phone-tools"><section><h3>补充边界用例</h3>' +
      '<label class="phone-label">输入类型<select class="phone-input" data-key="phone-preset">' +
      samples.map(sample => option(sample.key, sample.name, s.preset === sample.key)).join('') +
      '</select></label><button type="button" class="phone-btn phone-btn-light phone-wide" ' +
      'data-act="phone-add-preset">加入测试表</button></section>' +
      '<section><h3>缺陷线索</h3><p>' + hint + '</p>' +
      (observed ? '<ul class="phone-evidence-list" aria-label="当前用例证实的实现缺陷">' + observed + '</ul>' : '') +
      '<p class="phone-tool-note">接口判断与课堂规则冲突，就记为实现缺陷。同一缺陷只算一次。</p></section>' +
      '<section><h3>CSV 用例</h3><div class="phone-file-actions">' +
      '<label class="phone-btn phone-btn-light phone-file">导入 CSV' +
      '<input type="file" data-key="phone-import" accept=".csv,text/csv,text/plain" aria-label="导入 CSV 用例">' +
      '</label><button type="button" class="phone-btn phone-btn-light" data-act="phone-export">导出 CSV</button></div>' +
      '<p class="phone-tool-note">导入会追加到表尾。表头用“输入原文”和“预期校验结果”，预期填“有效”或“无效”。</p>' +
      (s.importNote ? '<p role="status" class="phone-import-note' + (s.importError ? ' phone-import-error' : '') +
        '">' + escape(s.importNote) + '</p>' : '') + '</section></div>';
  }

  function stats(s) {
    const { passed, failed, found } = counts(s);
    return [['通过', passed, '例'], ['失败', failed, '例'], ['已发现缺陷', found.size, '类']];
  }

  function summary(s) {
    const { found, passed, failed, pending } = counts(s);
    return [
      ['被测接口', servicePath],
      ['格式要求', '11 位半角数字，首位为 1，第二位为 3–9'],
      ['用例执行', passed + ' 例通过，' + failed + ' 例失败，' + pending + ' 例待运行'],
      ['已发现缺陷', found.size + ' / 2 类' + (found.size ? ' · ' + [...found].map(key => defects[key]).join('、') : '')]
    ];
  }

  function evidence(s) {
    const firstExamples = new Map();
    for (const row of s.rows) {
      const key = defectFor(row);
      if (key && !firstExamples.has(key)) firstExamples.set(key, row);
    }
    const examples = new Set(firstExamples.values());
    const ordered = [...examples, ...s.rows.filter(row => row.actual !== null && !examples.has(row)),
      ...s.rows.filter(row => row.actual === null)];
    const snapshot = ordered.slice(0, 8).map(row => {
      const actual = row.actual === null ? '待运行' : '实际' + validity(row.actual) + ' · ' + verdict(row);
      const defect = defectFor(row);
      const observed = '预期' + validity(row.expected) + ' · ' + actual + (defect ? ' · ' + defects[defect] : '');
      const label = preview(row.name || '未命名', 24);
      const raw = preview(visibleRaw(row.raw), 40);
      return ['#' + row.id + ' ' + label + ' · ' + raw, observed];
    });
    if (ordered.length > snapshot.length) {
      snapshot.push(['其他用例', '另有 ' + (ordered.length - snapshot.length) + ' 例，完整记录可导出为 CSV。']);
    }
    return snapshot;
  }

  Lab.scenes.phone = { init, act, tick, workspace, controls, stats, summary, evidence };
})();

</script>
<script>
(() => {
  'use strict';

  const Lab = window.Lab;
  const people = ['order', 'product'];
  const roles = {
    order: { name: '订单服务', field: 'stock', expects: '下单时读取库存数量' },
    product: { name: '商品服务', field: 'available', expects: '商品页读取有货标记' }
  };
  const versions = [
    ['original', '原始实现'],
    ['rename', '字段改名 · stock → quantity'],
    ['extra', '新增字段 · warehouse'],
    ['type', '类型变化 · stock 变为字符串'],
    ['status', '状态码变化 · 200 → 202']
  ];
  const versionNames = Object.fromEntries(versions);
  const modes = [['consumer', '消费者驱动'], ['provider', '提供者驱动']];
  const modeNames = Object.fromEntries(modes);
  const stages = {
    consumer: ['消费者制定契约', 'Stub 验证消费代码', '提供者重放请求'],
    provider: ['提供者制定契约', '验证并发布 Stub', '消费者接入 Stub']
  };
  const descriptions = {
    consumer: [
      '订单和商品分别约定各自要读取的字段。可以单步观察这两份契约怎样验证库存服务。',
      '两份契约已就绪。下一步用各自的 Stub 响应运行订单和商品的消费代码。',
      '消费者测试已执行。下一步由库存服务重放通过测试的契约，核对实际响应。',
      '本轮已结束。对照两位消费者的 Stub 结果和库存服务的重放结果，查看本次变更的影响。'
    ],
    provider: [
      '库存服务制定一份公开契约。提供者先验证实现，两个消费者随后接入同一份 Stub。',
      '公开契约已就绪。下一步用契约请求测试当前库存实现，通过后发布 Stub。',
      '提供者已完成验证。两个消费者将在下一步尝试使用已发布的 Stub。',
      '本轮已结束。查看提供者的发布结果，以及订单和商品能否处理公开契约的响应。'
    ]
  };

  const has = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const emptyMap = () => Object.create(null);
  const kind = value => value === null ? 'null' : typeof value;
  const show = value => value === undefined ? '缺失' : JSON.stringify(value);
  const escape = value => Lab.ui.escape(String(value));

  function makeYaml(id) {
    const fields = id === 'shared' ? people : [id];
    return [
      'request:',
      '  method: POST',
      '  url: /inventory/check',
      '  headers:',
      '    Content-Type: application/json',
      '  body:',
      '    sku: SKU-042',
      '  matchers:',
      '    body:',
      '      - path: $.sku',
      '        type: by_regex',
      "        value: 'SKU-[0-9]{3}'",
      'response:',
      '  status: 200',
      '  headers:',
      '    Content-Type: application/json',
      '  body:',
      ...fields.map(person => person === 'order' ? '    stock: 12' : '    available: true'),
      '  matchers:',
      '    body:',
      ...fields.flatMap(person => ['      - path: $.' + roles[person].field, '        type: by_type'])
    ].join('\n');
  }

  function fail(line, message) {
    throw new Error((line ? '第 ' + line + ' 行，' : '') + message);
  }

  function stripComment(line) {
    let quote = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (quote === '"' && c === '\\') { i++; continue; }
      if (quote && c === quote) {
        if (quote === "'" && line[i + 1] === "'") { i++; continue; }
        quote = '';
      } else if (!quote && (c === "'" || c === '"')) {
        quote = c;
      } else if (!quote && c === '#' && (i === 0 || /\s/.test(line[i - 1]))) {
        return line.slice(0, i).trimEnd();
      }
    }
    return line.trimEnd();
  }

  function scalar(raw, line) {
    if (!raw) fail(line, '请填写一个值。空字符串可以写成两个引号。');
    if (raw.length > 256) fail(line, '单个值最多 256 个字符。');
    if (raw[0] === '"') {
      try { return JSON.parse(raw); } catch { fail(line, '双引号字符串有误。正则中的反斜线可以放在单引号内。'); }
    }
    if (raw[0] === "'") {
      if (!/^'(?:[^']|'')*'$/.test(raw)) fail(line, '请检查单引号字符串。');
      return raw.slice(1, -1).replace(/''/g, "'");
    }
    if (raw === 'true' || raw === 'false') return raw === 'true';
    if (raw === 'null') return null;
    if (/^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(raw)) {
      const number = Number(raw);
      if (!Number.isFinite(number)) fail(line, '数字超出可表示范围。');
      return number;
    }
    if (/^[{[&*!|>@%]/.test(raw) || /:(?:\s|$)/.test(raw) || /\s\/\//.test(raw) || /^[-?:](?:\s|$)/.test(raw)) {
      fail(line, '此处支持单行标量。特殊字符请加引号，注释请用 #。');
    }
    return raw;
  }

  function pair(text, line) {
    const match = /^("[^"\\]+"|'[^']+'|[A-Za-z_][A-Za-z0-9_.-]*)\s*:(?:[ ]+(.*))?$/.exec(text);
    if (!match) fail(line, '请使用“键: 值”，冒号后留一个空格。');
    const key = match[1].replace(/^['"]|['"]$/g, '');
    if (!/^[A-Za-z_][A-Za-z0-9_.-]{0,63}$/.test(key) || ['__proto__', 'prototype', 'constructor'].includes(key)) {
      fail(line, '字段名可使用字母、数字、下划线、连字符和点，并以字母或下划线开头。');
    }
    return [key, match[2] || ''];
  }

  function add(map, key, value, line) {
    if (has(map, key)) fail(line, '键 ' + key + ' 重复了。');
    map[key] = value;
  }

  // The matcher uses bounded dynamic programming. Student input never becomes a JavaScript RegExp.
  function regexMatcher(pattern, line) {
    const error = message => fail(line, 'by_regex 匹配规则有误。' + message);
    if (typeof pattern !== 'string' || !pattern.length || pattern.length > 96) error('请写 1–96 个字符的正则字符串。');
    let i = pattern[0] === '^' ? 1 : 0;
    let end = pattern.length;
    if (pattern.endsWith('$')) {
      let backslashes = 0;
      for (let pos = end - 2; pos >= 0 && pattern[pos] === '\\'; pos--) backslashes++;
      if (backslashes % 2 === 0) end--;
    }
    const atoms = [];
    while (i < end) {
      const c = pattern[i++];
      let accepts;
      if (c === '[') {
        const close = pattern.indexOf(']', i);
        if (close < i || close >= end) error('字符组缺少 ]。');
        const chars = pattern.slice(i, close);
        if (!/^[A-Za-z0-9 _.-]+$/.test(chars)) error('字符组支持字母、数字、空格、点、下划线和连字符。');
        const ranges = [];
        for (let j = 0; j < chars.length;) {
          const from = chars.charCodeAt(j++);
          let to = from;
          if (chars[j] === '-' && j + 1 < chars.length) {
            to = chars.charCodeAt(j + 1);
            j += 2;
            if (to < from) error('字符组的范围应从小到大。');
          }
          ranges.push([from, to]);
        }
        accepts = char => ranges.some(range => char.charCodeAt(0) >= range[0] && char.charCodeAt(0) <= range[1]);
        i = close + 1;
      } else if (c === '\\') {
        if (i >= end) error('反斜线后缺少字符。');
        const literal = pattern[i++];
        if (literal === 'd') accepts = char => /[0-9]/.test(char);
        else if (literal === 'w') accepts = char => /[A-Za-z0-9_]/.test(char);
        else if (literal === 's') accepts = char => /\s/.test(char);
        else if ('\\.[]{}^$?*+-()|'.includes(literal)) accepts = char => char === literal;
        else error('支持 \\d、\\w、\\s 和转义标点。');
      } else if (c === '.') {
        accepts = char => char !== '\n' && char !== '\r';
      } else {
        if ('()|{}[]?*+^$'.includes(c)) error('此练习支持字符组和重复次数，暂不支持分组、分支或此位置的符号。');
        accepts = char => char === c;
      }
      let min = 1;
      let max = 1;
      const repeat = pattern[i];
      if (i < end && ['?', '+', '*'].includes(repeat)) {
        min = repeat === '+' ? 1 : 0;
        max = repeat === '?' ? 1 : 128;
        i++;
      } else if (i < end && repeat === '{') {
        const amount = /^\{(\d{1,3})(?:,(\d{0,3}))?\}/.exec(pattern.slice(i, end));
        if (!amount) error('重复次数可写成 {3} 或 {1,4}。');
        min = Number(amount[1]);
        max = amount[2] === undefined ? min : amount[2] === '' ? 128 : Number(amount[2]);
        if (min > max || max > 128) error('重复次数须在 0–128 之间，且下界不大于上界。');
        i += amount[0].length;
      }
      atoms.push({ accepts, min, max });
      if (atoms.length > 64) error('最多支持 64 个字符单元。');
    }
    if (!atoms.length) error('缺少匹配内容。');
    return value => {
      if (typeof value !== 'string' || value.length > 128) return false;
      let previous = new Uint8Array(value.length + 1);
      previous[0] = 1;
      for (const atom of atoms) {
        const prefix = new Uint16Array(value.length + 2);
        for (let pos = 0; pos <= value.length; pos++) prefix[pos + 1] = prefix[pos] + previous[pos];
        const next = new Uint8Array(value.length + 1);
        let run = 0;
        for (let pos = 0; pos <= value.length; pos++) {
          run = pos && atom.accepts(value[pos - 1]) ? run + 1 : 0;
          const low = Math.max(0, pos - run, pos - atom.max);
          const high = pos - atom.min;
          if (high >= low && prefix[high + 1] > prefix[low]) next[pos] = 1;
        }
        previous = next;
      }
      return previous[value.length] === 1;
    };
  }

  function compile(source) {
    if (source.length > 8192) fail(0, '每份契约最多 8,192 个字符。');
    const lines = source.replace(/\r\n?/g, '\n').split('\n');
    if (lines.length > 160) fail(0, '每份契约最多 160 行。');
    const doc = emptyMap();
    let side = '';
    let section = '';
    let list = null;
    let item = null;
    for (let index = 0; index < lines.length; index++) {
      const line = index + 1;
      const raw = stripComment(lines[index]);
      if (!raw.trim()) continue;
      const prefix = raw.match(/^\s*/)[0];
      if (/[^ ]/.test(prefix)) fail(line, '缩进请用半角空格，每层两个。');
      const depth = prefix.length;
      const text = raw.slice(depth);
      if (depth === 0) {
        const [key, value] = pair(text, line);
        if (!['request', 'response'].includes(key) || value) fail(line, '顶层支持 request: 和 response: 两个区块。');
        add(doc, key, emptyMap(), line);
        side = key;
        section = '';
        list = item = null;
      } else if (depth === 2 && side) {
        const [key, value] = pair(text, line);
        const scalars = side === 'request' ? ['url', 'method'] : ['status'];
        if (scalars.includes(key)) {
          add(doc[side], key, scalar(value, line), line);
          section = '';
        } else if (['headers', 'body', 'matchers'].includes(key)) {
          if (value && value !== '{}') fail(line, key + ' 请分行缩进，空对象可写作 {}。');
          add(doc[side], key, emptyMap(), line);
          section = value ? '' : key;
        } else {
          fail(line, side + ' 不支持 ' + key + '。');
        }
        list = item = null;
      } else if (depth === 4 && (section === 'headers' || section === 'body')) {
        const [key, rawValue] = pair(text, line);
        const value = scalar(rawValue, line);
        const map = doc[side][section];
        if (Object.keys(map).length >= 32) fail(line, '每个区块最多 32 个字段。');
        if (section === 'headers') {
          if (typeof value !== 'string') fail(line, 'HTTP 头的值应为字符串，数字请加引号。');
          if (Object.keys(map).some(name => name.toLowerCase() === key.toLowerCase())) fail(line, 'HTTP 头 ' + key + ' 重复了。');
        }
        add(map, key, value, line);
      } else if (depth === 4 && section === 'matchers') {
        const [key, value] = pair(text, line);
        if (key !== 'body' || (value && value !== '[]')) fail(line, 'matchers 支持 body 列表，空列表可写作 []。');
        const entries = [];
        add(doc[side].matchers, 'body', entries, line);
        list = value ? null : entries;
        item = null;
      } else if (list && (depth === 6 || depth === 8)) {
        let entry = text;
        if (depth === 6) {
          if (!/^-(?: |$)/.test(text)) fail(line, '每条匹配规则以“- ”开头。');
          if (list.length >= 32) fail(line, '每组最多 32 条匹配规则。');
          item = { line, fields: emptyMap() };
          list.push(item);
          entry = text.slice(1).trimStart();
          if (!entry) continue;
        }
        if (!item) fail(line, '请先使用“- ”开始一条匹配规则。');
        const [key, value] = pair(entry, line);
        if (!['path', 'type', 'value'].includes(key)) fail(line, '匹配规则不支持 ' + key + '。');
        add(item.fields, key, scalar(value, line), line);
      } else {
        fail(line, '请检查缩进。body 和 headers 支持一层字段，matchers.body 使用列表。');
      }
    }
    if (!doc.request || !doc.response) fail(0, '请同时定义 request 和 response。');
    if (!['GET', 'HEAD', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS'].includes(doc.request.method)) fail(0, 'request.method 需要大写 HTTP 方法，例如 POST。');
    if (typeof doc.request.url !== 'string' || !/^\/[^\s]*$/.test(doc.request.url)) fail(0, 'request.url 需要以 / 开头的路径。');
    if (!Number.isInteger(doc.response.status) || doc.response.status < 100 || doc.response.status > 599) fail(0, 'response.status 需要 100–599 之间的整数。');
    if (!doc.response.body) fail(0, '请定义 response.body。空响应体可以写作 body: {}。');
    for (const part of [doc.request, doc.response]) {
      part.body = part.body || emptyMap();
      part.headers = part.headers || emptyMap();
      part.rules = emptyMap();
      for (const { line, fields } of (part.matchers?.body || [])) {
        const path = typeof fields.path === 'string' && /^(?:\$\.([A-Za-z_][\w-]*)|\$\.?\['([A-Za-z_][\w.-]*)'\]|\$\.?\["([A-Za-z_][\w.-]*)"\])$/.exec(fields.path);
        if (!path) fail(line, 'path 可以写成 $.stock，也可以用方括号引用带点的字段名。');
        const key = path[1] || path[2] || path[3];
        if (!has(part.body, key)) fail(line, '匹配路径 ' + fields.path + ' 在对应的 body 中没有示例值。');
        if (!['by_type', 'by_regex'].includes(fields.type)) fail(line, 'type 可选 by_type 或 by_regex。');
        if (fields.type === 'by_type' && has(fields, 'value')) fail(line, 'by_type 会读取示例的类型，请移除 value。');
        const test = fields.type === 'by_regex' ? regexMatcher(fields.value, line) : null;
        if (test && !test(part.body[key])) fail(line, 'body 的示例值没有匹配 ' + fields.value + '。by_regex 匹配完整字符串。');
        add(part.rules, key, { type: fields.type, value: fields.value, test }, line);
      }
    }
    return doc;
  }

  function standardRequest() {
    return {
      method: 'POST', url: '/inventory/check',
      headers: { 'Content-Type': 'application/json' }, body: { sku: 'SKU-042' }
    };
  }

  function header(headers, name) {
    const key = Object.keys(headers).find(k => k.toLowerCase() === name.toLowerCase());
    return key === undefined ? undefined : headers[key];
  }

  function response(status, body) {
    return { status, headers: { 'Content-Type': 'application/json' }, body };
  }

  function inventory(request, version) {
    if (request.url !== '/inventory/check') return response(404, { error: 'unknown_route' });
    if (request.method !== 'POST') return response(405, { error: 'method_not_allowed' });
    if ((header(request.headers, 'Content-Type') || '').split(';')[0].trim().toLowerCase() !== 'application/json') {
      return response(415, { error: 'unsupported_media_type' });
    }
    const sku = request.body.sku;
    if (typeof sku !== 'string') return response(400, { error: 'missing_sku' });
    const catalog = { 'SKU-042': 12, 'SKU-007': 0 };
    if (!has(catalog, sku)) return response(404, { error: 'unknown_sku' });
    const stock = catalog[sku];
    const body = { sku };
    body[version === 'rename' ? 'quantity' : 'stock'] = version === 'type' ? String(stock) : stock;
    body.available = stock > 0;
    if (version === 'extra') body.warehouse = 'SH-01';
    return response(version === 'status' ? 202 : 200, body);
  }

  function compare(expected, actual, side) {
    const misses = [];
    for (const key of side === 'request' ? ['method', 'url'] : ['status']) {
      if (expected[key] !== actual[key]) misses.push(key + ' 预期 ' + show(expected[key]) + '，实际 ' + show(actual[key]) + '。');
    }
    for (const [key, value] of Object.entries(expected.headers)) {
      const actualValue = header(actual.headers, key);
      if (actualValue !== value) misses.push('HTTP 头 ' + key + ' 预期 ' + show(value) + '，实际' + (actualValue === undefined ? '缺失' : '为 ' + show(actualValue)) + '。');
    }
    for (const [key, value] of Object.entries(expected.body)) {
      const rule = expected.rules[key];
      const path = 'body.' + key;
      const received = actual.body[key];
      if (!has(actual.body, key)) {
        misses.push('缺少 ' + path + '。');
      } else if (rule?.type === 'by_type') {
        if (kind(value) !== kind(received)) misses.push(path + ' 需要 ' + kind(value) + '，实际为 ' + kind(received) + '。');
      } else if (rule?.type === 'by_regex') {
        if (!rule.test(received)) misses.push(path + ' 的值 ' + show(received) + ' 未匹配 ' + rule.value + '。');
      } else if (value !== received) {
        misses.push(path + ' 预期 ' + show(value) + '，实际为 ' + show(received) + '。');
      }
    }
    return misses;
  }

  function result(issues, success) {
    return { status: issues.length ? 'fail' : 'pass', note: issues[0] || success, issues };
  }

  const blocked = note => ({ status: 'blocked', note, issues: [] });
  const invalid = error => ({ status: 'invalid', note: error, issues: [] });

  function consume(person, actual) {
    const { field } = roles[person];
    if (actual.status !== 200) return result(['消费代码需要 HTTP 200，收到 ' + actual.status + '。']);
    if ((header(actual.headers, 'Content-Type') || '').split(';')[0].trim().toLowerCase() !== 'application/json') {
      return result(['消费代码需要 application/json 响应。']);
    }
    if (!has(actual.body, field)) return result(['读取不到 ' + field + '。']);
    const value = actual.body[field];
    if (person === 'order') {
      if (!Number.isInteger(value) || value < 0) return result(['stock 需要非负整数，读到 ' + show(value) + '（' + kind(value) + '）。']);
      return result([], 'stock = ' + value + (value > 0 ? '，允许下单。' : '，提示库存不足。'));
    }
    if (typeof value !== 'boolean') return result(['available 需要布尔值，读到 ' + show(value) + '。']);
    return result([], 'available = ' + value + (value ? '，显示有货。' : '，显示缺货。'));
  }

  function ownTest(version, actual) {
    const quantityField = version === 'rename' ? 'quantity' : 'stock';
    const expected = version === 'type' ? '12' : 12;
    const checks = [
      { pass: actual.status === 200, note: 'HTTP ' + actual.status + '（预期 200）' },
      { pass: actual.body.sku === 'SKU-042', note: 'sku = ' + show(actual.body.sku) },
      { pass: actual.body[quantityField] === expected, note: quantityField + ' = ' + show(actual.body[quantityField]) }
    ];
    return {
      status: checks.every(check => check.pass) ? 'pass' : 'fail',
      count: checks.filter(check => check.pass).length,
      note: checks.map(check => check.note).join('，'),
      issues: checks.filter(check => !check.pass).map(check => check.note)
    };
  }

  const docIds = s => s.mode === 'consumer' ? people : ['shared'];
  const activeDoc = s => s.mode === 'consumer' ? s.tab : 'shared';
  const docName = id => id === 'shared' ? '公开契约' : roles[id].name + '契约';

  function parseFor(s, id) {
    try {
      const doc = compile(s.drafts[id]);
      delete s.errors[id];
      return doc;
    } catch (error) {
      s.errors[id] = error.message;
      return null;
    }
  }

  function clearResults(s) {
    s.phase = 0;
    s.own = null;
    s.providerChecks = {};
    s.consumerChecks = {};
    s.liveChecks = {};
    s.stubSource = '';
    s.manual = '';
  }

  function init() {
    const s = {
      time: 0, mode: 'consumer', version: 'original', tab: 'order', help: false,
      drafts: { order: makeYaml('order'), product: makeYaml('product'), shared: makeYaml('shared') },
      errors: {}
    };
    clearResults(s);
    return s;
  }

  function runProvider(s, recordedOnly = false) {
    const actual = inventory(standardRequest(), s.version);
    s.own = ownTest(s.version, actual);
    for (const person of people) s.liveChecks[person] = consume(person, actual);
    for (const id of docIds(s)) {
      const doc = parseFor(s, id);
      if (!doc) {
        s.providerChecks[id] = invalid(s.errors[id]);
        continue;
      }
      if (recordedOnly && s.consumerChecks[id]?.status !== 'pass') {
        s.providerChecks[id] = blocked('该消费者的 Stub 测试尚未通过，没有可重放的记录。');
        continue;
      }
      const { method, url, headers, body } = doc.request;
      const request = { method, url, headers, body };
      const replay = inventory(request, s.version);
      const checked = result(compare(doc.response, replay, 'response'), 'HTTP ' + replay.status + '、约定的头和正文字段均匹配。');
      s.providerChecks[id] = { ...checked, request, actual: replay };
    }
  }

  function runConsumers(s, publishedOnly = false) {
    s.stubSource = publishedOnly ? (s.providerChecks.shared?.status === 'pass' ? '已发布 Stub' : '等待发布 Stub') : '草稿 Stub';
    for (const person of people) {
      if (publishedOnly && s.providerChecks.shared?.status !== 'pass') {
        s.consumerChecks[person] = blocked('公开契约未通过提供者验证，尚无已发布的 Stub。');
        continue;
      }
      const id = s.mode === 'consumer' ? person : 'shared';
      const doc = parseFor(s, id);
      if (!doc) {
        s.consumerChecks[person] = invalid(s.errors[id]);
        continue;
      }
      const misses = compare(doc.request, standardRequest(), 'request');
      if (misses.length) {
        s.consumerChecks[person] = result(misses.map(note => 'Stub 未匹配调用请求。' + note));
      } else {
        // The stub replies with the contract's example, independently of the selected inventory version.
        s.consumerChecks[person] = consume(person, doc.response);
      }
    }
  }

  function step(s) {
    if (s.phase >= 3) return;
    s.manual = '';
    s.phase++;
    if (s.phase === 1) {
      for (const id of docIds(s)) parseFor(s, id);
    } else if (s.phase === 2) {
      if (s.mode === 'consumer') runConsumers(s);
      else runProvider(s);
    } else if (s.mode === 'consumer') {
      runProvider(s, true);
    } else {
      runConsumers(s, true);
    }
  }

  function act(s, key, value, target, ctx) {
    switch (key) {
      case 'contract-mode':
        if (has(modeNames, value) && s.mode !== value) { s.mode = value; clearResults(s); }
        break;
      case 'contract-version':
        if (has(versionNames, value) && s.version !== value) { s.version = value; clearResults(s); }
        break;
      case 'contract-doc':
        if (people.includes(value)) s.tab = value;
        break;
      case 'contract-yaml': {
        const id = activeDoc(s);
        if (s.drafts[id] !== String(value)) {
          s.drafts[id] = String(value);
          parseFor(s, id);
          clearResults(s);
        }
        break;
      }
      case 'contract-restore': {
        const id = activeDoc(s);
        s.drafts[id] = makeYaml(id);
        delete s.errors[id];
        clearResults(s);
        ctx?.notify('已恢复' + docName(id) + '的示例');
        break;
      }
      case 'contract-help': s.help = !s.help; break;
      case 'contract-next':
        if (s.phase === 3) clearResults(s);
        step(s);
        break;
      case 'contract-run':
        clearResults(s);
        while (s.phase < 3) step(s);
        ctx?.notify('本轮契约验证已结束');
        break;
      case 'contract-test-consumer':
        s.phase = 0;
        s.manual = 'consumer';
        runConsumers(s);
        ctx?.notify('已用当前草稿生成 Stub 并验证消费代码');
        break;
      case 'contract-test-provider':
        s.phase = 0;
        s.manual = 'provider';
        runProvider(s);
        ctx?.notify('已重放契约请求并核对库存服务的响应');
        break;
    }
  }

  function controls(s) {
    const ui = Lab.ui;
    return '<div class="ct-controls">' +
      ui.select('contract-mode', '契约制定方式', s.mode, modes) +
      ui.select('contract-version', '库存接口的实现', s.version, versions) +
      '<div class="ct-control-actions">' + ui.button('contract-run', '运行完整流程', 'primary') +
      ui.button('contract-next', s.phase === 3 ? '从头单步' : '下一步') + '</div></div>';
  }

  const statusNames = { pass: '通过', fail: '失败', invalid: '契约有误', blocked: '未执行' };

  function badge(check, impact = false) {
    if (!check) return '<span class="ct-badge ct-idle">待验证</span>';
    const label = impact && check.status === 'pass' ? '可用' : impact && check.status === 'fail' ? '受影响' : statusNames[check.status];
    return '<span class="ct-badge ct-' + check.status + '">' + label + '</span>';
  }

  function runRow(label, check, impact = false) {
    const issues = check && check.issues?.length > 1
      ? '<ul class="ct-issues">' + check.issues.slice(1).map(issue => '<li>' + escape(issue) + '</li>').join('') + '</ul>' : '';
    return '<div class="ct-check"><div class="ct-check-title"><span>' + escape(label) + '</span>' +
      badge(check, impact) + '</div>' + (check ? '<p>' + escape(check.note) + '</p>' + issues : '') + '</div>';
  }

  function flowView(s) {
    const title = modeNames[s.mode] + '流程';
    const steps = stages[s.mode].map((name, index) => {
      const done = index + 1 <= s.phase;
      const providerStep = s.mode === 'consumer' ? 2 : 1;
      const checks = Object.values(index === providerStep ? s.providerChecks : s.consumerChecks);
      const problem = done && (index === 0 ? docIds(s).some(id => s.errors[id]) :
        checks.some(check => ['invalid', 'fail'].includes(check.status)) ||
        (checks.some(check => check.status === 'blocked') && checks.some(check => check.status === 'pass')));
      const gated = done && index > 0 && checks.length && checks.every(check => check.status === 'blocked');
      const stateClass = !done ? '' : problem ? 'ct-problem' : gated ? 'ct-gated' : 'ct-done';
      const mark = !done ? index + 1 : problem ? '!' : gated ? '—' : '&#10003;';
      return '<li class="' + stateClass + '"' +
        (s.phase === index + 1 ? ' aria-current="step"' : '') + '><span class="ct-step-num">' +
        mark + '</span><span>' + name + '</span></li>';
    }).join('');
    let note = descriptions[s.mode][s.phase];
    if (s.manual === 'consumer') note = '已用草稿 Stub 单独验证两个消费者。运行完整流程可查看本轮的契约发布结果。';
    if (s.manual === 'provider') note = '已单独验证库存实现。左栏显示两个消费者接入当前实现时分别能否完成业务。';
    if (s.phase === 1 && docIds(s).some(id => s.errors[id])) note = '契约存在语法错误。编辑器下方会列出原因，修正后可重新运行。';
    if (s.mode === 'provider' && s.phase === 2 && s.providerChecks.shared?.status !== 'pass') {
      note = '公开契约未通过验证。库存服务无法发布本轮 Stub，下一步可查看消费者的状态。';
    }
    return '<section class="ct-flow" aria-label="' + title + '"><div class="ct-flow-heading"><h3>' + title +
      '</h3><span>' + s.phase + ' / 3 步</span></div><ol class="ct-steps">' + steps + '</ol><p>' + note + '</p></section>';
  }

  function consumerView(s) {
    const cards = people.map(person => {
      const role = roles[person];
      return '<article class="ct-consumer"><h4>' + role.name + '<code>' + person + '</code></h4>' +
        '<p class="ct-dependency">' + role.expects + ' <code>' + role.field + '</code></p>' +
        runRow(s.stubSource || '契约 Stub', s.consumerChecks[person]) +
        runRow('接入当前实现', s.liveChecks[person], true) + '</article>';
    }).join('');
    return '<section class="ct-column"><div class="ct-column-heading"><h3>消费者</h3><span>2 个调用方</span></div>' + cards +
      '<div class="ct-column-foot">' + Lab.ui.button('contract-test-consumer', '用草稿验证消费者') +
      '<p>对应 Stub Runner 加载的 WireMock 测试桩。消费者收到契约里的响应示例。</p></div></section>';
  }

  function helpView() {
    return '<div class="ct-help"><p>编辑器支持 Spring Cloud Contract 的 HTTP YAML 子集。每层缩进两个空格。headers 和 body 使用单层字段。body 支持字符串、数字、布尔值和 null。</p>' +
      '<p>在任一侧的 matchers.body 中定义规则。<code>by_type</code> 检查示例值的类型。<code>by_regex</code> 匹配完整字符串，支持字符组、<code>\\d</code>、<code>\\w</code>、<code>\\s</code>、点和重复次数。</p>' +
      '<p><code>SKU-[0-9]{3}</code> 可以匹配 <code>SKU-042</code>。普通字段按值比较，实际响应可以包含额外字段。库存样例为 SKU-042（12 件）和 SKU-007（0 件）。</p></div>';
  }

  function editorView(s) {
    const id = activeDoc(s);
    const yaml = s.drafts[id];
    const tabs = s.mode === 'consumer' ? '<div class="ct-tabs" role="group" aria-label="选择契约">' + people.map(person =>
      '<button type="button" data-act="contract-doc" data-value="' + person + '" aria-pressed="' + (id === person) + '">' +
      (person === 'order' ? '订单' : '商品') + '契约' + (s.errors[person] ? ' !' : '') + '</button>').join('') + '</div>' :
      '<div class="ct-public">库存服务公开契约</div>';
    const error = s.errors[id];
    return '<section class="ct-column ct-editor"><div class="ct-column-heading"><h3>契约</h3><span>YAML</span></div>' +
      tabs + '<label class="ct-code-label" for="ct-yaml">' + escape(id + '.yml') + '<span>可编辑</span></label>' +
      '<textarea id="ct-yaml" data-key="contract-yaml" aria-label="' + docName(id) + ' YAML" aria-describedby="ct-diagnostic" aria-invalid="' +
      Boolean(error) + '" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" maxlength="16384" rows="16">\n' +
      escape(yaml) + '</textarea><p id="ct-diagnostic" class="ct-diagnostic' + (error ? ' ct-error' : '') + '">' +
      (error ? escape(error) : '语法通过 · ' + yaml.split(/\r\n?|\n/).length + ' 行') +
      '</p><div class="ct-editor-tools"><button type="button" data-act="contract-help" aria-expanded="' + s.help +
      '">' + (s.help ? '收起语法说明' : '查看语法说明') + '</button><button type="button" data-act="contract-restore">恢复当前示例</button></div>' +
      (s.help ? helpView() : '') + '</section>';
  }

  function providerView(s) {
    const id = activeDoc(s);
    const replay = s.providerChecks[id];
    const request = replay?.request || standardRequest();
    const actual = replay?.actual || inventory(request, s.version);
    const title = replay?.actual ? docName(id) + '重放' : '标准查询';
    const ownLabel = s.own ? '接口自测 · ' + s.own.count + '/3' : '接口自测';
    const rows = docIds(s).map(docId => runRow(docName(docId), s.providerChecks[docId])).join('');
    return '<section class="ct-column"><div class="ct-column-heading"><h3>提供者</h3><code>inventory</code></div>' +
      '<div class="ct-preview"><div class="ct-preview-title"><span>' + title + '</span><code>HTTP ' + actual.status + '</code></div>' +
      '<p class="ct-endpoint">' + escape(request.method + ' ' + request.url) + '</p><pre aria-label="库存服务实际响应">' +
      escape(JSON.stringify(actual.body, null, 2)) + '</pre></div><div class="ct-provider-checks">' +
      runRow(ownLabel, s.own) + rows + '</div><div class="ct-column-foot">' +
      Lab.ui.button('contract-test-provider', '重放请求验证提供者') +
      '<p>Verifier 重放契约。接口自测另外检查 HTTP 200、SKU 回显和本版数量字段。</p></div></section>';
  }

  function workspace(s) {
    return '<div class="ct-workbench">' + flowView(s) + '<div class="ct-grid">' +
      consumerView(s) + editorView(s) + providerView(s) + '</div></div>';
  }

  function passCount(results, total) {
    const rows = Object.values(results);
    return rows.length ? rows.filter(row => row.status === 'pass').length + '/' + total : '—';
  }

  function impacted(s) {
    return people.filter(person => s.liveChecks[person]?.status === 'fail');
  }

  function stats(s) {
    return [
      ['提供者契约通过', passCount(s.providerChecks, docIds(s).length), '份'],
      ['Stub 测试通过', passCount(s.consumerChecks, people.length), '个'],
      ['受影响消费者', s.own ? impacted(s).length : '—', '个']
    ];
  }

  function summary(s) {
    const affected = impacted(s).map(person => roles[person].name);
    return [
      ['驱动方式', modeNames[s.mode]], ['库存接口', versionNames[s.version]],
      ['提供者接口自测', s.own ? s.own.count + '/3 通过' : '待验证'],
      ['提供者契约验证', passCount(s.providerChecks, docIds(s).length)],
      ['Stub 消费测试', passCount(s.consumerChecks, people.length)],
      ['接入当前实现受影响', s.own ? (affected.join('、') || '无') : '待验证']
    ];
  }

  function observed(check) {
    return check ? statusNames[check.status] + ' · ' + check.note : '待验证';
  }

  function evidence(s) {
    return [
      ['库存服务 · 接口自测', observed(s.own)],
      ...docIds(s).map(id => [docName(id) + ' · 提供者重放', observed(s.providerChecks[id])]),
      ...people.flatMap(person => [
        [roles[person].name + ' · ' + (s.stubSource || 'Stub'), observed(s.consumerChecks[person])],
        [roles[person].name + ' · 接入当前实现', observed(s.liveChecks[person])]
      ])
    ];
  }

  Lab.scenes.contract = { init, tick: step, act, controls, workspace, stats, summary, evidence };
})();

</script>
<script>
(() => {
  'use strict';

  const stages = new WeakMap();
  const TAU = 2 * Math.PI;
  const slope = 0.46;
  const fontFamily = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
  const palette = {
    client: '#7de9c5', gateway: '#ff9a7c', product: '#b6a1ff', registry: '#aab4ff',
    reject: '#ff836a', order: '#91c9e9', control: '#a9b9ff', config: '#9ebfff',
    review: '#d4a6e9', inventory: '#87d7c6', v1: '#b7a6fd', v2: '#ecabe7', sidecar: '#84dce2'
  };
  const edgeTones = {flow: '#83efd0', blocked: '#ff967d', control: '#b7aeff', idle: '#767895'};
  const statusTones = {up: '#77e8b9', down: '#ff8979', slow: '#ffc37e', pending: '#f6ce8a', muted: '#9594ab'};
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const mix = (a, b, t) => a + (b - a) * t;
  const project = (x, y, z = 0) => [(x - y) * 0.89, (x + y) * 0.89 * slope - z];

  function tint(hex, opacity) {
    const value = parseInt(hex.slice(1), 16);
    return 'rgba(' + (value >> 16) + ',' + (value >> 8 & 255) + ',' + (value & 255) + ',' + opacity + ')';
  }

  function lit(hex, amount) {
    const channels = [1, 3, 5].map(index => parseInt(hex.slice(index, index + 2), 16));
    return 'rgb(' + channels.map(c => Math.round(mix(c, amount > 0 ? 255 : 0, Math.abs(amount)))).join(',') + ')';
  }

  function hash(key) {
    let value = 2166136261;
    for (const character of String(key)) value = Math.imul(value ^ character.charCodeAt(0), 16777619);
    return (value >>> 0) / 4294967296;
  }

  function gradient(ctx, x1, y1, x2, y2, start, end) {
    const brush = ctx.createLinearGradient(x1, y1, x2, y2);
    brush.addColorStop(0, start);
    brush.addColorStop(1, end);
    return brush;
  }

  function path(ctx, points, close = false) {
    ctx.beginPath();
    points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (close) ctx.closePath();
  }

  function stroke(ctx, points, color, width = 1) {
    path(ctx, points);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function polygon(ctx, points, fill, border, width = 0.7) {
    path(ctx, points, true);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  function ellipse(ctx, x, y, rx, ry, fill, border, width = 0.8) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  function glow(ctx, x, y, rx, ry, color, amount) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx, ry);
    const light = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    light.addColorStop(0, tint(color, amount));
    light.addColorStop(0.48, tint(color, amount * 0.53));
    light.addColorStop(1, tint(color, 0));
    ctx.fillStyle = light;
    ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
  }

  const line3 = (ctx, points, color, width) => stroke(ctx, points.map(p => project(...p)), color, width);
  const poly3 = (ctx, points, color, border, width) => polygon(ctx, points.map(p => project(...p)), color, border, width);

  function cutRect(x1, y1, x2, y2, cut) {
    return [[x1 + cut, y1], [x2 - cut, y1], [x2, y1 + cut], [x2, y2 - cut],
      [x2 - cut, y2], [x1 + cut, y2], [x1, y2 - cut], [x1, y1 + cut]];
  }

  // A chamfered footprint, extruded vertically. Only its camera-facing walls are visible.
  function slab(ctx, footprint, bottom, top, colors, rim) {
    footprint.forEach((a, i) => {
      const b = footprint[(i + 1) % footprint.length];
      const facing = (b[1] - a[1]) - (b[0] - a[0]);
      if (facing <= 0) return;
      const alongX = Math.abs(b[0] - a[0]);
      const alongY = Math.abs(b[1] - a[1]);
      const fill = alongX > alongY ? colors[1] : alongX < alongY ? colors[2] : (colors[3] || colors[1]);
      const wall = [[...a, bottom], [...b, bottom], [...b, top], [...a, top]];
      let skin = fill;
      if (top - bottom > 3.2 && /^#[a-f0-9]{6}$/i.test(fill)) {
        const [x, y] = project((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, top);
        skin = gradient(ctx, x, y - 0.8, x, y + top - bottom, lit(fill, 0.08), lit(fill, -0.13));
      }
      poly3(ctx, wall, skin, fill, 0.45);
    });
    poly3(ctx, footprint.map(([x, y]) => [x, y, top]), colors[0], rim, 0.65);
  }

  function box(ctx, x1, y1, x2, y2, bottom, top, colors, cut = 1.7, rim) {
    slab(ctx, cutRect(x1, y1, x2, y2, cut), bottom, top, colors, rim);
  }

  function frontPanel(ctx, x1, x2, y, z1, z2, fill, frame) {
    poly3(ctx, [[x1, y, z1], [x2, y, z1], [x2, y, z2], [x1, y, z2]], fill, frame);
  }

  function sidePanel(ctx, y1, y2, x, z1, z2, fill, frame) {
    poly3(ctx, [[x, y1, z1], [x, y2, z1], [x, y2, z2], [x, y1, z2]], fill, frame);
  }

  function plate(ctx, accent) {
    const large = cutRect(-32, -27, 32, 27, 7);
    slab(ctx, large, -3, 1.5, ['#35394f', '#282b41', '#1d2035', '#323349']);
    slab(ctx, large, 1.6, 3, [tint(accent, 0.65), tint(accent, 0.55), tint(accent, 0.33), tint(accent, 0.6)]);
    slab(ctx, large, 3.1, 7, [gradient(ctx, -36, -22, 30, 25, '#53556b', '#303449'), '#36384f', '#292d43', '#44475a'], '#66687c');
    const inset = cutRect(-29, -24, 29, 24, 6);
    poly3(ctx, inset.map(([x, y]) => [x, y, 7.1]), '#303448', tint(accent, 0.40), 0.7);
    for (const [x, y] of [[-25, -19], [25, -19], [25, 19], [-25, 19]]) {
      const [sx, sy] = project(x, y, 7.4);
      ellipse(ctx, sx, sy, 1.5, 0.8, '#171b2b', '#76778b', 0.5);
    }
    for (let x = -13; x <= -1; x += 3.2) {
      line3(ctx, [[x, 25.6, 7.3], [x + 0.9, 23, 7.3]], tint(accent, 0.62), 0.8);
    }
    line3(ctx, [[11, 27.05, 4.4], [20, 27.05, 4.4]], accent, 1.2);
  }

  const rackMaterials = {
    product: ['#d5c7ff', '#a58fdf', '#7864b3', '#8e79c5', '#453b66'],
    v1: ['#d5caff', '#a697df', '#786db9', '#9181c9', '#443b67'],
    v2: ['#f2caf2', '#cc95d2', '#996da9', '#b981c0', '#553d61']
  };

  function rack(ctx, role, node, lamp) {
    const [lid, face, side, bevel, dark] = rackMaterials[role] || rackMaterials.product;
    box(ctx, -20, -15, 20, 16, 7.5, 12, [bevel, dark, '#373348'], 2);
    for (let index = 0; index < 3; index++) {
      const z = 12 + index * 14.8;
      box(ctx, -19.5, -15, 20, 16, z, z + 2.2, ['#6d618c', '#3c354f', '#353045'], 2);
      box(ctx, -21, -16.5, 21, 17.5, z + 2, z + 13.3, [lid, face, side, bevel], 2.2, tint(lid, 0.7));
      frontPanel(ctx, -16.6, 16.9, 17.65, z + 4.2, z + 10.9, dark, '#766b94');
      frontPanel(ctx, -13.4, 3.5, 17.78, z + 6, z + 9, '#2a263d');
      line3(ctx, [[-13, 17.9, z + 9.1], [3.4, 17.9, z + 9.1]], '#897da4', 0.65);
      for (let x = -11.8; x < 3; x += 2.8) {
        line3(ctx, [[x, 18, z + 6.2], [x + 0.75, 18, z + 8.6]], '#8a7d9e', 0.65);
      }
      for (const x of [8.2, 11.8]) {
        const [sx, sy] = project(x, 18, z + 7.5);
        ellipse(ctx, sx, sy, 1.05, 0.8, x < 10 ? lamp : '#b4a6db');
      }
      line3(ctx, [[16.3, 17.7, z + 5], [16.3, 17.7, z + 10.5]], lid, 1);
      for (let y = -11; y <= 10; y += 3.5) {
        line3(ctx, [[21.1, y, z + 5], [21.1, y, z + 9.5]], dark, 1.05);
      }
    }
    box(ctx, -21.4, -16.8, 21.5, 18, 55.5, 59.5, [lid, face, bevel, face], 3, '#e7dcff');
    const roof = cutRect(-16, -12, 16, 12, 2.4);
    poly3(ctx, roof.map(([x, y]) => [x, y, 59.7]), '#b7a5d7', '#e1d3f6', 0.7);
    for (let x = -10; x <= 5; x += 3.4) {
      line3(ctx, [[x, -6.5, 60], [x, 6.5, 60]], '#75678e', 1.25);
      line3(ctx, [[x + 0.9, -6.5, 60], [x + 0.9, 6.5, 60]], '#dbcaee', 0.6);
    }
    const [lx, ly] = project(10, 3, 60);
    ellipse(ctx, lx, ly, 3, 1.45, '#554d6c', '#e7d9fa', 0.55);
    ellipse(ctx, lx, ly, 1.6, 0.8, lamp);
  }

  // A solid arch with an open centre. The front and rear profiles are joined in depth.
  function gateway(ctx, lamp) {
    box(ctx, -27, -13, 27, 14, 7.4, 9.6, ['#674e50', '#534147', '#473c45'], 3);
    for (const y of [-11, -2, 7, 16]) {
      line3(ctx, [[-3.4, y - 1, 9.8], [0, y + 1.5, 9.8], [3.4, y - 1, 9.8]], '#e6af91', 0.92);
    }
    for (const x of [-22, 22]) {
      box(ctx, x - 5.7, -8.3, x + 5.7, 9.3, 9, 13, ['#c59283', '#9a716c', '#795657'], 1.6);
    }
    const profile = [[-28, 12], [-28, 46], [-27, 51], [-24, 56], [-19.5, 60], [-14, 62],
      [14, 62], [19.5, 60], [24, 56], [27, 51], [28, 46], [28, 12], [17.8, 12],
      [17.8, 44], [17.2, 47], [15.3, 50], [12.3, 51.7], [-12.3, 51.7], [-15.3, 50],
      [-17.2, 47], [-17.8, 44], [-17.8, 12]];
    const profileAt = (y) => profile.map(([x, z]) => project(x, y, z));
    const front = 7.8, rear = -7.8;
    polygon(ctx, profileAt(rear), '#995951', '#bc7265');
    profile.forEach(([x1, z1], i) => {
      const [x2, z2] = profile[(i + 1) % profile.length];
      const nx = z1 - z2;
      const nz = x2 - x1;
      if (nx + 0.82 * nz <= 0) return;
      const strength = nz / (Math.abs(nz) + Math.abs(nx) || 1);
      let fill = '#c16b59';
      if (i >= 12) fill = strength < 0 ? '#78474a' : '#a1645b';
      else if (strength > 0.74) fill = '#ffd0aa';
      else if (strength > 0.37) fill = '#f8b38e';
      else if (strength > 0) fill = '#e89576';
      poly3(ctx, [[x1, rear, z1], [x2, rear, z2], [x2, front, z2], [x1, front, z1]], fill, fill, 0.65);
    });
    polygon(ctx, profileAt(front), gradient(ctx, -35, -52, 18, -12, '#ffb69b', '#ed8069'), '#ffc4a8', 0.85);
    const inside = [[-20.2, 16], [-20.2, 44], [-19.5, 48.3], [-17.3, 51.8], [-13.1, 54.2],
      [13.1, 54.2], [17.3, 51.8], [19.5, 48.3], [20.2, 44], [20.2, 16]];

  function drum(ctx, x, y, z, radius, height, cap, left, right, rim) {
    const [cx, cy] = project(x, y, z);
    const rx = radius * 1.26;
    const ry = rx * slope;
    const skin = ctx.createLinearGradient(cx - rx, cy, cx + rx, cy);
    skin.addColorStop(0, right);
    skin.addColorStop(0.24, left);
    skin.addColorStop(0.6, left);
    skin.addColorStop(1, right);
    ctx.beginPath();
    ctx.moveTo(cx - rx, cy - height);
    ctx.lineTo(cx - rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, cy - height);
    ctx.closePath();
    ctx.fillStyle = skin;
    ctx.fill();
    ellipse(ctx, cx, cy - height, rx, ry, cap, rim, 0.85);
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0.08, Math.PI - 0.08);
    ctx.strokeStyle = right;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  function registry(ctx, lamp) {

    const top = 46.3;
    ellipse(ctx, 0, -top, 19.7, 9, '#a8b7df', '#e1e8ff', 0.8);
    ellipse(ctx, 0, -top, 15, 6.9, '#abbbe6', '#7788b3', 0.75);
    const hubs = [[-7, -3], [0.5, 6.3], [7.2, -4.5]];
    line3(ctx, [hubs[0], hubs[1], hubs[2]].map(([x, y]) => [x, y, top + 0.6]), '#53648b', 1.5);

    for (const x of [-15.6, -4, 7.6]) {

    line3(ctx, [[-4.2, 1.8, 37.8], [4.2, 1.8, 46.2]], '#ffe4d3', 2);
