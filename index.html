          ranges.push([from, to]);
        }
        accepts = char => ranges.some(range => char.charCodeAt(0) >= range[0] && char.charCodeAt(0) <= range[1]);
        i = close + 1;
      } else if (c === '\\') {
        if (i >= end) error('反斜线后缺少字符。');
        const literal = pattern[i++];
        if (literal === 'd') accepts = char => /[0-9]/.test(char);
        else if (literal === 'w') accepts = char => /[A-Za-z0-9_]/.test(char);
        else if (literal === 's') accepts = char => /\s/.test(char);
        else if ('\\.[]{}^$?*+-()|'.includes(literal)) accepts = char => char === literal;
        else error('支持 \\d、\\w、\\s 和转义标点。');
      } else if (c === '.') {
        accepts = char => char !== '\n' && char !== '\r';
      } else {
        if ('()|{}[]?*+^$'.includes(c)) error('此练习支持字符组和重复次数，暂不支持分组、分支或此位置的符号。');
        accepts = char => char === c;
      }
      let min = 1;
      let max = 1;
      const repeat = pattern[i];
      if (i < end && ['?', '+', '*'].includes(repeat)) {
        min = repeat === '+' ? 1 : 0;
        max = repeat === '?' ? 1 : 128;
        i++;
      } else if (i < end && repeat === '{') {
        const amount = /^\{(\d{1,3})(?:,(\d{0,3}))?\}/.exec(pattern.slice(i, end));
        if (!amount) error('重复次数可写成 {3} 或 {1,4}。');
        min = Number(amount[1]);
        max = amount[2] === undefined ? min : amount[2] === '' ? 128 : Number(amount[2]);
        if (min > max || max > 128) error('重复次数须在 0–128 之间，且下界不大于上界。');
        i += amount[0].length;
      }
      atoms.push({ accepts, min, max });
      if (atoms.length > 64) error('最多支持 64 个字符单元。');
    }
    if (!atoms.length) error('缺少匹配内容。');
    return value => {
      if (typeof value !== 'string' || value.length > 128) return false;
      let previous = new Uint8Array(value.length + 1);
      previous[0] = 1;
      for (const atom of atoms) {
        const prefix = new Uint16Array(value.length + 2);
        for (let pos = 0; pos <= value.length; pos++) prefix[pos + 1] = prefix[pos] + previous[pos];
        const next = new Uint8Array(value.length + 1);
        let run = 0;
        for (let pos = 0; pos <= value.length; pos++) {
          run = pos && atom.accepts(value[pos - 1]) ? run + 1 : 0;
          const low = Math.max(0, pos - run, pos - atom.max);
          const high = pos - atom.min;
          if (high >= low && prefix[high + 1] > prefix[low]) next[pos] = 1;
        }
        previous = next;
      }
      return previous[value.length] === 1;
    };
  }

  function compile(source) {
    if (source.length > 8192) fail(0, '每份契约最多 8,192 个字符。');
    const lines = source.replace(/\r\n?/g, '\n').split('\n');
    if (lines.length > 160) fail(0, '每份契约最多 160 行。');
    const doc = emptyMap();
    let side = '';
    let section = '';
    let list = null;
    let item = null;
    for (let index = 0; index < lines.length; index++) {
      const line = index + 1;
      const raw = stripComment(lines[index]);
      if (!raw.trim()) continue;
      const prefix = raw.match(/^\s*/)[0];
      if (/[^ ]/.test(prefix)) fail(line, '缩进请用半角空格，每层两个。');
      const depth = prefix.length;
      const text = raw.slice(depth);
      if (depth === 0) {
        const [key, value] = pair(text, line);
        if (!['request', 'response'].includes(key) || value) fail(line, '顶层支持 request: 和 response: 两个区块。');
        add(doc, key, emptyMap(), line);
        side = key;
        section = '';
        list = item = null;
      } else if (depth === 2 && side) {
        const [key, value] = pair(text, line);
        const scalars = side === 'request' ? ['url', 'method'] : ['status'];
        if (scalars.includes(key)) {
          add(doc[side], key, scalar(value, line), line);
          section = '';
        } else if (['headers', 'body', 'matchers'].includes(key)) {
          if (value && value !== '{}') fail(line, key + ' 请分行缩进，空对象可写作 {}。');
          add(doc[side], key, emptyMap(), line);
          section = value ? '' : key;
        } else {
          fail(line, side + ' 不支持 ' + key + '。');
        }
        list = item = null;
      } else if (depth === 4 && (section === 'headers' || section === 'body')) {
        const [key, rawValue] = pair(text, line);
        const value = scalar(rawValue, line);
        const map = doc[side][section];
        if (Object.keys(map).length >= 32) fail(line, '每个区块最多 32 个字段。');
        if (section === 'headers') {
          if (typeof value !== 'string') fail(line, 'HTTP 头的值应为字符串，数字请加引号。');
          if (Object.keys(map).some(name => name.toLowerCase() === key.toLowerCase())) fail(line, 'HTTP 头 ' + key + ' 重复了。');
        }
        add(map, key, value, line);
      } else if (depth === 4 && section === 'matchers') {
        const [key, value] = pair(text, line);
        if (key !== 'body' || (value && value !== '[]')) fail(line, 'matchers 支持 body 列表，空列表可写作 []。');
        const entries = [];
        add(doc[side].matchers, 'body', entries, line);
        list = value ? null : entries;
        item = null;
      } else if (list && (depth === 6 || depth === 8)) {
        let entry = text;
        if (depth === 6) {
          if (!/^-(?: |$)/.test(text)) fail(line, '每条匹配规则以“- ”开头。');
          if (list.length >= 32) fail(line, '每组最多 32 条匹配规则。');
          item = { line, fields: emptyMap() };
          list.push(item);
          entry = text.slice(1).trimStart();
          if (!entry) continue;
        }
        if (!item) fail(line, '请先使用“- ”开始一条匹配规则。');
        const [key, value] = pair(entry, line);
        if (!['path', 'type', 'value'].includes(key)) fail(line, '匹配规则不支持 ' + key + '。');
        add(item.fields, key, scalar(value, line), line);
      } else {
        fail(line, '请检查缩进。body 和 headers 支持一层字段，matchers.body 使用列表。');
      }
    }
    if (!doc.request || !doc.response) fail(0, '请同时定义 request 和 response。');
    if (!['GET', 'HEAD', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS'].includes(doc.request.method)) fail(0, 'request.method 需要大写 HTTP 方法，例如 POST。');
    if (typeof doc.request.url !== 'string' || !/^\/[^\s]*$/.test(doc.request.url)) fail(0, 'request.url 需要以 / 开头的路径。');
    if (!Number.isInteger(doc.response.status) || doc.response.status < 100 || doc.response.status > 599) fail(0, 'response.status 需要 100–599 之间的整数。');
    if (!doc.response.body) fail(0, '请定义 response.body。空响应体可以写作 body: {}。');
    for (const part of [doc.request, doc.response]) {
      part.body = part.body || emptyMap();
      part.headers = part.headers || emptyMap();
      part.rules = emptyMap();
      for (const { line, fields } of (part.matchers?.body || [])) {
        const path = typeof fields.path === 'string' && /^(?:\$\.([A-Za-z_][\w-]*)|\$\.?\['([A-Za-z_][\w.-]*)'\]|\$\.?\["([A-Za-z_][\w.-]*)"\])$/.exec(fields.path);
        if (!path) fail(line, 'path 可以写成 $.stock，也可以用方括号引用带点的字段名。');
        const key = path[1] || path[2] || path[3];
        if (!has(part.body, key)) fail(line, '匹配路径 ' + fields.path + ' 在对应的 body 中没有示例值。');
        if (!['by_type', 'by_regex'].includes(fields.type)) fail(line, 'type 可选 by_type 或 by_regex。');
        if (fields.type === 'by_type' && has(fields, 'value')) fail(line, 'by_type 会读取示例的类型，请移除 value。');
        const test = fields.type === 'by_regex' ? regexMatcher(fields.value, line) : null;
        if (test && !test(part.body[key])) fail(line, 'body 的示例值没有匹配 ' + fields.value + '。by_regex 匹配完整字符串。');
        add(part.rules, key, { type: fields.type, value: fields.value, test }, line);
      }
    }
    return doc;
  }

  function standardRequest() {
    return {
      method: 'POST', url: '/inventory/check',
      headers: { 'Content-Type': 'application/json' }, body: { sku: 'SKU-042' }
    };
  }

  function header(headers, name) {
    const key = Object.keys(headers).find(k => k.toLowerCase() === name.toLowerCase());
    return key === undefined ? undefined : headers[key];
  }

  function response(status, body) {
    return { status, headers: { 'Content-Type': 'application/json' }, body };
  }

  function inventory(request, version) {
    if (request.url !== '/inventory/check') return response(404, { error: 'unknown_route' });
    if (request.method !== 'POST') return response(405, { error: 'method_not_allowed' });
    if ((header(request.headers, 'Content-Type') || '').split(';')[0].trim().toLowerCase() !== 'application/json') {
      return response(415, { error: 'unsupported_media_type' });
    }
    const sku = request.body.sku;
    if (typeof sku !== 'string') return response(400, { error: 'missing_sku' });
    const catalog = { 'SKU-042': 12, 'SKU-007': 0 };
    if (!has(catalog, sku)) return response(404, { error: 'unknown_sku' });
    const stock = catalog[sku];
    const body = { sku };
    body[version === 'rename' ? 'quantity' : 'stock'] = version === 'type' ? String(stock) : stock;
    body.available = stock > 0;
    if (version === 'extra') body.warehouse = 'SH-01';
    return response(version === 'status' ? 202 : 200, body);
  }

  function compare(expected, actual, side) {
    const misses = [];
    for (const key of side === 'request' ? ['method', 'url'] : ['status']) {
      if (expected[key] !== actual[key]) misses.push(key + ' 预期 ' + show(expected[key]) + '，实际 ' + show(actual[key]) + '。');
    }
    for (const [key, value] of Object.entries(expected.headers)) {
      const actualValue = header(actual.headers, key);
      if (actualValue !== value) misses.push('HTTP 头 ' + key + ' 预期 ' + show(value) + '，实际' + (actualValue === undefined ? '缺失' : '为 ' + show(actualValue)) + '。');
    }
    for (const [key, value] of Object.entries(expected.body)) {
      const rule = expected.rules[key];
      const path = 'body.' + key;
      const received = actual.body[key];
      if (!has(actual.body, key)) {
        misses.push('缺少 ' + path + '。');
      } else if (rule?.type === 'by_type') {
        if (kind(value) !== kind(received)) misses.push(path + ' 需要 ' + kind(value) + '，实际为 ' + kind(received) + '。');
      } else if (rule?.type === 'by_regex') {
        if (!rule.test(received)) misses.push(path + ' 的值 ' + show(received) + ' 未匹配 ' + rule.value + '。');
      } else if (value !== received) {
        misses.push(path + ' 预期 ' + show(value) + '，实际为 ' + show(received) + '。');
      }
    }
    return misses;
  }

  function result(issues, success) {
    return { status: issues.length ? 'fail' : 'pass', note: issues[0] || success, issues };
  }

  const blocked = note => ({ status: 'blocked', note, issues: [] });
  const invalid = error => ({ status: 'invalid', note: error, issues: [] });

  function consume(person, actual) {
    const { field } = roles[person];
    if (actual.status !== 200) return result(['消费代码需要 HTTP 200，收到 ' + actual.status + '。']);
    if ((header(actual.headers, 'Content-Type') || '').split(';')[0].trim().toLowerCase() !== 'application/json') {
      return result(['消费代码需要 application/json 响应。']);
    }
    if (!has(actual.body, field)) return result(['读取不到 ' + field + '。']);
    const value = actual.body[field];
    if (person === 'order') {
      if (!Number.isInteger(value) || value < 0) return result(['stock 需要非负整数，读到 ' + show(value) + '（' + kind(value) + '）。']);
      return result([], 'stock = ' + value + (value > 0 ? '，允许下单。' : '，提示库存不足。'));
    }
    if (typeof value !== 'boolean') return result(['available 需要布尔值，读到 ' + show(value) + '。']);
    return result([], 'available = ' + value + (value ? '，显示有货。' : '，显示缺货。'));
  }

  function ownTest(version, actual) {
    const quantityField = version === 'rename' ? 'quantity' : 'stock';
    const expected = version === 'type' ? '12' : 12;
    const checks = [
      { pass: actual.status === 200, note: 'HTTP ' + actual.status + '（预期 200）' },
      { pass: actual.body.sku === 'SKU-042', note: 'sku = ' + show(actual.body.sku) },
      { pass: actual.body[quantityField] === expected, note: quantityField + ' = ' + show(actual.body[quantityField]) }
    ];
    return {
      status: checks.every(check => check.pass) ? 'pass' : 'fail',
      count: checks.filter(check => check.pass).length,
      note: checks.map(check => check.note).join('，'),
      issues: checks.filter(check => !check.pass).map(check => check.note)
    };
  }

  const docIds = s => s.mode === 'consumer' ? people : ['shared'];
  const activeDoc = s => s.mode === 'consumer' ? s.tab : 'shared';
  const docName = id => id === 'shared' ? '公开契约' : roles[id].name + '契约';

  function parseFor(s, id) {
    try {
      const doc = compile(s.drafts[id]);
      delete s.errors[id];
      return doc;
    } catch (error) {
      s.errors[id] = error.message;
      return null;
    }
  }

  function clearResults(s) {
    s.phase = 0;
    s.own = null;
    s.providerChecks = {};
    s.consumerChecks = {};
    s.liveChecks = {};
    s.stubSource = '';
    s.manual = '';
    s.manualBatch = null;
    s.batch = null;
    Lab.flow.begin(s, s.time);
  }

  function init() {
    const s = {
      time: 0, mode: 'consumer', version: 'original', tab: 'order', help: false,
      drafts: { order: makeYaml('order'), product: makeYaml('product'), shared: makeYaml('shared') },
      errors: {}
    };
    clearResults(s);
    return s;
  }

  function recordCall(batch, path, checked, details) {
    // A complete consumer-driven run fits four actual calls into one simulation second.
    const at = batch.requests.length * 0.24;
    Lab.flow.add(batch, at, path, [checked.status === 'pass' ? 'pass' : 'stop'], {
      ...details, assertion: checked.status, note: checked.note
    });
  }

  function runProvider(s, batch, recordedOnly = false) {
    const actual = inventory(standardRequest(), s.version);
    s.own = ownTest(s.version, actual);
    for (const person of people) s.liveChecks[person] = consume(person, actual);
    for (const id of docIds(s)) {
      const doc = parseFor(s, id);
      if (!doc) {
        s.providerChecks[id] = invalid(s.errors[id]);
        continue;
      }
      if (recordedOnly && s.consumerChecks[id]?.status !== 'pass') {
        s.providerChecks[id] = blocked('该消费者的 Stub 测试尚未通过，没有可重放的记录。');
        continue;
      }
      const { method, url, headers, body } = doc.request;
      const request = { method, url, headers, body };
      const replay = inventory(request, s.version);
      const checked = result(compare(doc.response, replay, 'response'), 'HTTP ' + replay.status + '、约定的头和正文字段均匹配。');
      s.providerChecks[id] = { ...checked, request, actual: replay };
      recordCall(batch, replayPath, checked, {
        operation: 'replay', contractId: id, label: docName(id) + '重放', method, url, httpStatus: replay.status
      });
    }
  }

  function runConsumers(s, batch, publishedOnly = false) {
    s.stubSource = publishedOnly ? (s.providerChecks.shared?.status === 'pass' ? '已发布 Stub' : '等待发布 Stub') : '草稿 Stub';
    for (const person of people) {
      if (publishedOnly && s.providerChecks.shared?.status !== 'pass') {
        s.consumerChecks[person] = blocked('公开契约未通过提供者验证，尚无已发布的 Stub。');
        continue;
      }
      const id = s.mode === 'consumer' ? person : 'shared';
      const doc = parseFor(s, id);
      if (!doc) {
        s.consumerChecks[person] = invalid(s.errors[id]);
        continue;
      }
      const request = standardRequest();
      const misses = compare(doc.request, request, 'request');
      // Matching requests receive the contract example. Unmatched requests still reached the stub.
      const checked = misses.length ? result(misses.map(note => 'Stub 未匹配调用请求。' + note)) : consume(person, doc.response);
      s.consumerChecks[person] = checked;
      recordCall(batch, stubPath, checked, {
        operation: 'stub', contractId: id, consumer: person, label: roles[person].name + '调用 Stub',
        method: request.method, url: request.url, httpStatus: misses.length ? null : doc.response.status
      });
    }
  }

  function step(s, batch) {
    if (s.phase >= 3) return;
    s.manual = '';
    s.phase++;
    if (s.phase === 1) {
      for (const id of docIds(s)) parseFor(s, id);
    } else if (s.phase === 2) {
      if (s.mode === 'consumer') runConsumers(s, batch);
      else runProvider(s, batch);
    } else if (s.mode === 'consumer') {
      runProvider(s, batch, true);
    } else {
      runConsumers(s, batch, true);
    }
  }

  function tick(s) {
    step(s, Lab.flow.begin(s, s.time));
  }

  function act(s, key, value, target, ctx) {
    switch (key) {
      case 'contract-mode':
        if (has(modeNames, value) && s.mode !== value) { s.mode = value; clearResults(s); }
        break;
      case 'contract-version':
        if (has(versionNames, value) && s.version !== value) { s.version = value; clearResults(s); }
        break;
      case 'contract-doc':
        if (people.includes(value)) s.tab = value;
        break;
      case 'contract-yaml': {
        const id = activeDoc(s);
        if (s.drafts[id] !== String(value)) {
          s.drafts[id] = String(value);
          parseFor(s, id);
          clearResults(s);
        }
        break;
      }
      case 'contract-restore': {
        const id = activeDoc(s);
        s.drafts[id] = makeYaml(id);
        delete s.errors[id];
        clearResults(s);
        ctx?.notify('已恢复' + docName(id) + '的示例');
        break;
      }
      case 'contract-help': s.help = !s.help; break;
      case 'contract-next':
        if (s.phase === 3) clearResults(s);
        step(s, Lab.flow.manual(s));
        break;
      case 'contract-run': {
        clearResults(s);
        const batch = Lab.flow.manual(s);
        while (s.phase < 3) step(s, batch);
        ctx?.notify('本轮契约验证已结束');
        break;
      }
      case 'contract-test-consumer':
        s.phase = 0;
        s.manual = 'consumer';
        runConsumers(s, Lab.flow.manual(s));
        ctx?.notify('已用当前草稿生成 Stub 并验证消费代码');
        break;
      case 'contract-test-provider':
        s.phase = 0;
        s.manual = 'provider';
        runProvider(s, Lab.flow.manual(s));
        ctx?.notify('已重放契约请求并核对库存服务的响应');
        break;
    }
  }

  function controls(s) {
    const ui = Lab.ui;
    return '<div class="ct-controls">' +
      ui.select('contract-mode', '契约制定方式', s.mode, modes) +
      ui.select('contract-version', '库存接口的实现', s.version, versions) +
      '<div class="ct-control-actions">' + ui.button('contract-run', '运行完整流程', 'primary') +
      ui.button('contract-next', s.phase === 3 ? '从头单步' : '下一步') + '</div></div>';
  }

  const statusNames = { pass: '通过', fail: '失败', invalid: '契约有误', blocked: '未执行' };

  function badge(check, impact = false) {
    if (!check) return '<span class="ct-badge ct-idle">待验证</span>';
    const label = impact && check.status === 'pass' ? '可用' : impact && check.status === 'fail' ? '受影响' : statusNames[check.status];
    return '<span class="ct-badge ct-' + check.status + '">' + label + '</span>';
  }

  function runRow(label, check, impact = false) {
    const issues = check && check.issues?.length > 1
      ? '<ul class="ct-issues">' + check.issues.slice(1).map(issue => '<li>' + escape(issue) + '</li>').join('') + '</ul>' : '';
    return '<div class="ct-check"><div class="ct-check-title"><span>' + escape(label) + '</span>' +
      badge(check, impact) + '</div>' + (check ? '<p>' + escape(check.note) + '</p>' + issues : '') + '</div>';
  }

  function flowView(s) {
    const title = modeNames[s.mode] + '流程';
    const steps = stages[s.mode].map((name, index) => {
      const done = index + 1 <= s.phase;
      const providerStep = s.mode === 'consumer' ? 2 : 1;
      const checks = Object.values(index === providerStep ? s.providerChecks : s.consumerChecks);
      const problem = done && (index === 0 ? docIds(s).some(id => s.errors[id]) :
        checks.some(check => ['invalid', 'fail'].includes(check.status)) ||
        (checks.some(check => check.status === 'blocked') && checks.some(check => check.status === 'pass')));
      const gated = done && index > 0 && checks.length && checks.every(check => check.status === 'blocked');
      const stateClass = !done ? '' : problem ? 'ct-problem' : gated ? 'ct-gated' : 'ct-done';
      const mark = !done ? index + 1 : problem ? '!' : gated ? '—' : '&#10003;';
      return '<li class="' + stateClass + '"' +
        (s.phase === index + 1 ? ' aria-current="step"' : '') + '><span class="ct-step-num">' +
        mark + '</span><span>' + name + '</span></li>';
    }).join('');
    let note = descriptions[s.mode][s.phase];
    if (s.manual === 'consumer') note = '已用草稿 Stub 单独验证两个消费者。运行完整流程可查看本轮的契约发布结果。';
    if (s.manual === 'provider') note = '已单独验证库存实现。左栏显示两个消费者接入当前实现时分别能否完成业务。';
    if (s.phase === 1 && docIds(s).some(id => s.errors[id])) note = '契约存在语法错误。编辑器下方会列出原因，修正后可重新运行。';
    if (s.mode === 'provider' && s.phase === 2 && s.providerChecks.shared?.status !== 'pass') {
      note = '公开契约未通过验证。库存服务无法发布本轮 Stub，下一步可查看消费者的状态。';
    }
    return '<section class="ct-flow" aria-label="' + title + '"><div class="ct-flow-heading"><h3>' + title +
      '</h3><span>' + s.phase + ' / 3 步</span></div><ol class="ct-steps">' + steps + '</ol><p>' + note + '</p></section>';
  }

  function consumerView(s) {
    const cards = people.map(person => {
      const role = roles[person];
      return '<article class="ct-consumer"><h4>' + role.name + '<code>' + person + '</code></h4>' +
        '<p class="ct-dependency">' + role.expects + ' <code>' + role.field + '</code></p>' +
        runRow(s.stubSource || '契约 Stub', s.consumerChecks[person]) +
        runRow('接入当前实现', s.liveChecks[person], true) + '</article>';
    }).join('');
    return '<section class="ct-column"><div class="ct-column-heading"><h3>消费者</h3><span>2 个调用方</span></div>' + cards +
      '<div class="ct-column-foot">' + Lab.ui.button('contract-test-consumer', '用草稿验证消费者') +
      '<p>对应 Stub Runner 加载的 WireMock 测试桩。消费者收到契约里的响应示例。</p></div></section>';
  }

  function helpView() {
    return '<div class="ct-help"><p>编辑器支持 Spring Cloud Contract 的 HTTP YAML 子集。每层缩进两个空格。headers 和 body 使用单层字段。body 支持字符串、数字、布尔值和 null。</p>' +
      '<p>在任一侧的 matchers.body 中定义规则。<code>by_type</code> 检查示例值的类型。<code>by_regex</code> 匹配完整字符串，支持字符组、<code>\\d</code>、<code>\\w</code>、<code>\\s</code>、点和重复次数。</p>' +
      '<p><code>SKU-[0-9]{3}</code> 可以匹配 <code>SKU-042</code>。普通字段按值比较，实际响应可以包含额外字段。库存样例为 SKU-042（12 件）和 SKU-007（0 件）。</p></div>';
  }

  function editorView(s) {
    const id = activeDoc(s);
    const yaml = s.drafts[id];
    const tabs = s.mode === 'consumer' ? '<div class="ct-tabs" role="group" aria-label="选择契约">' + people.map(person =>
      '<button type="button" data-act="contract-doc" data-value="' + person + '" aria-pressed="' + (id === person) + '">' +
      (person === 'order' ? '订单' : '商品') + '契约' + (s.errors[person] ? ' !' : '') + '</button>').join('') + '</div>' :
      '<div class="ct-public">库存服务公开契约</div>';
    const error = s.errors[id];
    return '<section class="ct-column ct-editor"><div class="ct-column-heading"><h3>契约</h3><span>YAML</span></div>' +
      tabs + '<label class="ct-code-label" for="ct-yaml">' + escape(id + '.yml') + '<span>可编辑</span></label>' +
      '<textarea id="ct-yaml" data-key="contract-yaml" aria-label="' + docName(id) + ' YAML" aria-describedby="ct-diagnostic" aria-invalid="' +
      Boolean(error) + '" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" maxlength="16384" rows="16">\n' +
      escape(yaml) + '</textarea><p id="ct-diagnostic" class="ct-diagnostic' + (error ? ' ct-error' : '') + '">' +
      (error ? escape(error) : '语法通过 · ' + yaml.split(/\r\n?|\n/).length + ' 行') +
      '</p><div class="ct-editor-tools"><button type="button" data-act="contract-help" aria-expanded="' + s.help +
      '">' + (s.help ? '收起语法说明' : '查看语法说明') + '</button><button type="button" data-act="contract-restore">恢复当前示例</button></div>' +
      (s.help ? helpView() : '') + '</section>';
  }

  function providerView(s) {
    const id = activeDoc(s);
    const replay = s.providerChecks[id];
    const request = replay?.request || standardRequest();
    const actual = replay?.actual || inventory(request, s.version);
    const title = replay?.actual ? docName(id) + '重放' : '标准查询';
    const ownLabel = s.own ? '接口自测 · ' + s.own.count + '/3' : '接口自测';
    const rows = docIds(s).map(docId => runRow(docName(docId), s.providerChecks[docId])).join('');
    return '<section class="ct-column"><div class="ct-column-heading"><h3>提供者</h3><code>inventory</code></div>' +
      '<div class="ct-preview"><div class="ct-preview-title"><span>' + title + '</span><code>HTTP ' + actual.status + '</code></div>' +
      '<p class="ct-endpoint">' + escape(request.method + ' ' + request.url) + '</p><pre aria-label="库存服务实际响应">' +
      escape(JSON.stringify(actual.body, null, 2)) + '</pre></div><div class="ct-provider-checks">' +
      runRow(ownLabel, s.own) + rows + '</div><div class="ct-column-foot">' +
      Lab.ui.button('contract-test-provider', '重放请求验证提供者') +
      '<p>Verifier 重放契约。接口自测另外检查 HTTP 200、SKU 回显和本版数量字段。</p></div></section>';
  }

  function workspace(s) {
    return '<div class="ct-workbench">' + flowView(s) + '<div class="ct-grid">' +
      consumerView(s) + editorView(s) + providerView(s) + '</div></div>';
  }

  function calledChecks(checks, pending) {
    const calls = Object.values(checks).filter(check => check.status === 'pass' || check.status === 'fail');
    return calls.length ? calls.filter(check => check.status === 'pass').length + '/' + calls.length + ' 通过' : pending;
  }

  function stage(s) {
    const stubStatus = s.stubSource === '等待发布 Stub' ? '等待发布' : '等待调用';
    return {
      nodes: [
        {id: 'consumer', role: 'client', label: '消费者', sub: '订单 / 商品'},
        {id: 'stub', role: 'product', label: '契约 Stub', sub: calledChecks(s.consumerChecks, stubStatus)},
        {id: 'verifier', role: 'control', label: 'Verifier', sub: calledChecks(s.providerChecks, '等待重放')},
        {id: 'inventory', role: 'inventory', label: '库存服务', sub: versionNames[s.version].split(' · ')[0]}
      ],
      edges: [stubPath, replayPath].map(([from, to]) => ({from, to, kind: 'flow', weight: 1})),
      ...Lab.flow.batches(s),
      legend: {pass: '验证通过', stop: '验证失败'}
    };
  }

  function passCount(results, total) {
    const rows = Object.values(results);
    return rows.length ? rows.filter(row => row.status === 'pass').length + '/' + total : '—';
  }

  function impacted(s) {
    return people.filter(person => s.liveChecks[person]?.status === 'fail');
  }

  function stats(s) {
    return [
      ['提供者契约通过', passCount(s.providerChecks, docIds(s).length), '份'],
      ['Stub 测试通过', passCount(s.consumerChecks, people.length), '个'],
      ['受影响消费者', s.own ? impacted(s).length : '—', '个']
    ];
  }

  Lab.scenes.contract = { init, tick, act, controls, workspace, stage, stats };
})();

(() => {

    reject: '#ff836a', order: '#91c9e9', control: '#a9b9ff', config: '#9ebfff',

  const statusTones = {up: '#77e8b9', down: '#ff8979', slow: '#ffc37e', pending: '#f6ce8a', muted: '#9594ab'};
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const mix = (a, b, t) => a + (b - a) * t;
  const project = (x, y, z = 0) => [(x - y) * 0.89, (x + y) * 0.89 * slope - z];

  function tint(hex, opacity) {
    const value = parseInt(hex.slice(1), 16);
    return 'rgba(' + (value >> 16) + ',' + (value >> 8 & 255) + ',' + (value & 255) + ',' + opacity + ')';
  }

  function lit(hex, amount) {
    const channels = [1, 3, 5].map(index => parseInt(hex.slice(index, index + 2), 16));
    return 'rgb(' + channels.map(c => Math.round(mix(c, amount > 0 ? 255 : 0, Math.abs(amount)))).join(',') + ')';
  }

  function hash(key) {
    let value = 2166136261;
    for (const character of String(key)) value = Math.imul(value ^ character.charCodeAt(0), 16777619);
    return (value >>> 0) / 4294967296;
  }

  function gradient(ctx, x1, y1, x2, y2, start, end) {
    const brush = ctx.createLinearGradient(x1, y1, x2, y2);
    brush.addColorStop(0, start);
    brush.addColorStop(1, end);
    return brush;
  }

  function path(ctx, points, close = false) {
    ctx.beginPath();
    points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (close) ctx.closePath();
  }

  function stroke(ctx, points, color, width = 1) {
    path(ctx, points);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function polygon(ctx, points, fill, border, width = 0.7) {
    path(ctx, points, true);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  function ellipse(ctx, x, y, rx, ry, fill, border, width = 0.8) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (border) {
      ctx.strokeStyle = border;
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  function glow(ctx, x, y, rx, ry, color, amount) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx, ry);
    const light = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    light.addColorStop(0, tint(color, amount));
    light.addColorStop(0.48, tint(color, amount * 0.53));
    light.addColorStop(1, tint(color, 0));
    ctx.fillStyle = light;
    ctx.fillRect(-1, -1, 2, 2);
    ctx.restore();
  }

  const line3 = (ctx, points, color, width) => stroke(ctx, points.map(p => project(...p)), color, width);
  const poly3 = (ctx, points, color, border, width) => polygon(ctx, points.map(p => project(...p)), color, border, width);

  function cutRect(x1, y1, x2, y2, cut) {
    return [[x1 + cut, y1], [x2 - cut, y1], [x2, y1 + cut], [x2, y2 - cut],
      [x2 - cut, y2], [x1 + cut, y2], [x1, y2 - cut], [x1, y1 + cut]];
  }

  // A chamfered footprint, extruded vertically. Only its camera-facing walls are visible.
  function slab(ctx, footprint, bottom, top, colors, rim) {
    footprint.forEach((a, i) => {
      const b = footprint[(i + 1) % footprint.length];
      const facing = (b[1] - a[1]) - (b[0] - a[0]);
      if (facing <= 0) return;
      const alongX = Math.abs(b[0] - a[0]);
      const alongY = Math.abs(b[1] - a[1]);
      const fill = alongX > alongY ? colors[1] : alongX < alongY ? colors[2] : (colors[3] || colors[1]);
      const wall = [[...a, bottom], [...b, bottom], [...b, top], [...a, top]];
      let skin = fill;
      if (top - bottom > 3.2 && /^#[a-f0-9]{6}$/i.test(fill)) {
        const [x, y] = project((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, top);
        skin = gradient(ctx, x, y - 0.8, x, y + top - bottom, lit(fill, 0.08), lit(fill, -0.13));
      }
      poly3(ctx, wall, skin, fill, 0.45);
    });
    poly3(ctx, footprint.map(([x, y]) => [x, y, top]), colors[0], rim, 0.65);
  }

  function box(ctx, x1, y1, x2, y2, bottom, top, colors, cut = 1.7, rim) {
    slab(ctx, cutRect(x1, y1, x2, y2, cut), bottom, top, colors, rim);
  }

  function frontPanel(ctx, x1, x2, y, z1, z2, fill, frame) {
    poly3(ctx, [[x1, y, z1], [x2, y, z1], [x2, y, z2], [x1, y, z2]], fill, frame);
  }

  function sidePanel(ctx, y1, y2, x, z1, z2, fill, frame) {

  function plate(ctx, accent) {

    slab(ctx, large, 3.1, 7, [gradient(ctx, -36, -22, 30, 25, '#53556b', '#303449'), '#36384f', '#292d43', '#44475a'], '#66687c');
    const inset = cutRect(-29, -24, 29, 24, 6);

    for (const [x, y] of [[-25, -19], [25, -19], [25, 19], [-25, 19]]) {

  const rackMaterials = {
    product: ['#d5c7ff', '#a58fdf', '#7864b3', '#8e79c5', '#453b66'],

  // The quota controller is a low slide gate. Its two rails leave the request lane open.

    for (let y = 10; y <= 16; y += 2.9) {

  function drum(ctx, x, y, z, radius, height, cap, left, right, rim) {
    const [cx, cy] = project(x, y, z);
    const rx = radius * 1.26;
    const ry = rx * slope;
    const skin = ctx.createLinearGradient(cx - rx, cy, cx + rx, cy);
    skin.addColorStop(0, right);
    skin.addColorStop(0.24, left);
    skin.addColorStop(0.6, left);
    skin.addColorStop(1, right);
    ctx.beginPath();
    ctx.moveTo(cx - rx, cy - height);
    ctx.lineTo(cx - rx, cy);
    ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rx, cy - height);
    ctx.closePath();
    ctx.fillStyle = skin;
    ctx.fill();
    ellipse(ctx, cx, cy - height, rx, ry, cap, rim, 0.85);

    ctx.ellipse(cx, cy, rx, ry, 0, 0.08, Math.PI - 0.08);

  function consoleUnit(ctx, role, lamp) {
    const isConfig = role === 'config';
    box(ctx, -18, -15, 18, 15, 7.5, 12.5, ['#717c97', '#55617c', '#45536c'], 3);
    box(ctx, -19.5, -16.5, 19.5, 16.5, 12.3, 27, ['#a0aed1', '#8897b5', '#616e92'], 3, '#c0c9e6');

    if (isConfig) {
      // A tangible control desk: three tracks with independent physical faders.
      box(ctx, -16, -12.4, 16, 12.3, 29.2, 31, ['#697c9e', '#55627d', '#454f68'], 1.5, '#9fafd1');
      for (const [x, y] of [[-9, -3.5], [0, 3.7], [9, -1]]) {

        box(ctx, x - 2.7, y - 2.2, x + 2.7, y + 2.2, 31.1, 34.3, ['#cbdff2', '#a1bbd4', '#8ca0c4'], 0.65);
      }
    } else {

  }

  function parcel(ctx, x, y, z, w, d, height, mint) {
    const colors = mint ? ['#cae5cc', '#8abbac', '#6a9e94', '#98b9a6'] :
      ['#edcfad', '#d3ab91', '#ae8c7d', '#c6a387'];
    const left = x - w / 2;
    const far = y - d / 2;
    const right = x + w / 2;
    const near = y + d / 2;
    box(ctx, left, far, right, near, z, z + height, colors, 0.85, colors[0]);
    poly3(ctx, [[x - 2.3, far, z + height + 0.1], [x + 2.3, far, z + height + 0.1],
      [x + 2.3, near, z + height + 0.1], [x - 2.3, near, z + height + 0.1]], mint ? '#8fbaa2' : '#d6ac82');
    frontPanel(ctx, x - 2.3, x + 2.3, near + 0.05, z + height * 0.55, z + height, mint ? '#74a392' : '#b99175');
    frontPanel(ctx, left + 2.4, left + Math.min(7.8, w * 0.42), near + 0.07, z + 2.1, z + 6.2, '#eadfcb');
    for (let k = 3.2; k < 6.9; k += 1.15) line3(ctx, [[left + k, near + 0.1, z + 3], [left + k, near + 0.1, z + 5.2]], '#6e7974', 0.48);
  }

  function fulfillment(ctx, role) {
    if (role === 'inventory') {
      box(ctx, -21.5, -17.3, 21.5, 17.3, 7.2, 11.8, ['#86a89c', '#5e827a', '#4e706b'], 2.6);
      parcel(ctx, -8, -6.8, 12, 19, 17, 15, true);
      parcel(ctx, 10.2, -4, 12, 15.6, 22.2, 15, true);
      parcel(ctx, -7.8, 9, 12, 18.8, 11.8, 13, true);
      parcel(ctx, -2, -5, 27.2, 19, 13, 14.5, true);
    } else {
      box(ctx, -23, -15, 23, 15, 7.5, 12.5, ['#a4bcca', '#748e9d', '#586d80'], 2.8, '#bdcfdd');
      box(ctx, -20, -12.4, 20, 12.4, 12.4, 14.9, ['#536476', '#455462', '#3a4556'], 2);
      for (let x = -15; x <= 16; x += 5.3) line3(ctx, [[x, -10, 15.2], [x, 10, 15.2]], '#9eafba', 1.25);
      parcel(ctx, 0, -1, 15.5, 26.2, 21, 20, false);
    }
  }

  function review(ctx, lamp) {
    box(ctx, -17, -13, 17, 13, 7.4, 14, ['#b8a6c1', '#907d9a', '#75687f'], 2.5);
    box(ctx, -9, -5, 9, 5, 14, 23, ['#cab5cd', '#9d89a5', '#86718d'], 1.3);
    const bubble = [[-20, 28], [-20, 44], [-17.2, 47.8], [16.5, 47.8], [20, 44],
      [20, 28], [16.5, 24.5], [0, 24.5], [-8, 18], [-8, 24.5], [-17, 24.5]];
    polygon(ctx, bubble.map(([x, z]) => project(x, -5, z)), '#a77fbb', '#ddc1e3');
    for (let i = 0; i < bubble.length; i++) {
      const [x, z] = bubble[i];
      const [x2, z2] = bubble[(i + 1) % bubble.length];
      poly3(ctx, [[x, -5, z], [x2, -5, z2], [x2, 1, z2], [x, 1, z]], z > 44 ? '#eed2e9' : '#b797bf');
    }
    polygon(ctx, bubble.map(([x, z]) => project(x, 1, z)), '#dec0db', '#f4dbee');
    frontPanel(ctx, -15, 15, 1.15, 28.5, 42, '#78617e', '#b795b4');
    for (const x of [-8, 0, 8]) {
      const [sx, sy] = project(x, 1.3, 35.5);
      ellipse(ctx, sx, sy, 1.8, 1.55, x < 0 ? lamp : '#e1c3d5');
    }
  }

  function sidecar(ctx, lamp) {
    box(ctx, -22, -12, 22, 12, 7.4, 11.5, ['#7da0a9', '#587883', '#4c6578'], 3);
    for (const x of [-10.5, 9.5]) {
      box(ctx, x - 7.7, -9, x + 7.7, 9, 11.3, 34, ['#c1e2df', '#9ccbc5', '#709ca4'], 2.4, '#d3f4ec');
      box(ctx, x - 7.9, -9.2, x + 7.9, 9.2, 33, 36.3, ['#bfe8df', '#91bebb', '#789da7'], 2.3);
      frontPanel(ctx, x - 4.5, x + 4.5, 9.15, 18, 29, '#536e79');
      for (let z = 21; z <= 27; z += 3) line3(ctx, [[x - 2.6, 9.4, z], [x + 2.6, 9.4, z]], z > 25 ? lamp : '#9cb7c2', 1);
    }
    line3(ctx, [[-8, -10, 26], [-8, -14, 26], [8, -14, 26], [8, -10, 26]], '#a2cfce', 1.5);
  }

  function reject(ctx, lamp) {
    for (const x of [-17.5, 17.5]) {
      box(ctx, x - 3.7, -2.5, x + 3.7, 4.8, 7.3, 11, ['#a38e8a', '#7c6869', '#67575c'], 1.1);
      box(ctx, x - 2.6, -1.3, x + 2.6, 3.7, 10.8, 29, ['#c8a7a1', '#a58d86', '#77666b'], 0.8);
    }
    box(ctx, -21.5, -3, 21.5, 4.4, 22, 30, ['#efb29b', '#bd8271', '#9a6d66'], 1.3, '#eab8a7');
    for (const x of [-15.6, -4, 7.6]) {
      poly3(ctx, [[x - 2, 4.53, 22.8], [x + 2.8, 4.53, 22.8],
        [x + 6.5, 4.53, 29], [x + 1.7, 4.53, 29]], '#6b575a');
    }
    const shield = [[-8, 32], [-12, 36], [-12, 47], [-7, 52], [7, 52],
      [12, 47], [12, 36], [8, 32]];
    box(ctx, -2, -2.2, 2, 2, 27.5, 37, ['#c6aaa0', '#957f7b', '#755f63'], 0.5);
    polygon(ctx, shield.map(([x, z]) => project(x, -2, z)), '#b76e68', '#ffc4ad');
    for (let i = 0; i < shield.length; i++) {
      const [x, z] = shield[i];
      const [x2, z2] = shield[(i + 1) % shield.length];
      poly3(ctx, [[x, -2, z], [x2, -2, z2], [x2, 1.5, z2], [x, 1.5, z]], z > 47 ? '#ffc4ad' : '#c68578');
    }
    polygon(ctx, shield.map(([x, z]) => project(x, 1.5, z)), '#e89583', '#ffccb2', 0.8);
    const inner = shield.map(([x, z]) => project(x * 0.78, 1.6, 42 + (z - 42) * 0.79));
    polygon(ctx, inner, '#965a59', '#d9887a', 0.65);
    line3(ctx, [[-4.2, 1.8, 37.8], [4.2, 1.8, 46.2]], '#ffe4d3', 2);
    line3(ctx, [[-4.2, 1.8, 46.2], [4.2, 1.8, 37.8]], '#ffe4d3', 2);
    const [x, y] = project(-16, 4.7, 26);
    ellipse(ctx, x, y, 1.1, 0.82, lamp);
  }

  function machine(ctx, item) {
    const {node, x, y, size} = item;
    const role = node.role;
    const status = node.status || 'up';
    const color = palette[role] || palette.product;
    const lamp = statusTones[status] || statusTones.up;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    plate(ctx, color);
    glow(ctx, 1, -4, 36, 13, '#131522', 0.58);
    if (role === 'client') terminal(ctx, lamp);
    else if (role === 'gateway') gateway(ctx, lamp);
    else if (role === 'registry') registry(ctx, lamp);
    else if (role === 'control' || role === 'config') consoleUnit(ctx, role, lamp);
    else if (role === 'order' || role === 'inventory') fulfillment(ctx, role);
    else if (role === 'review') review(ctx, lamp);
    else if (role === 'reject') reject(ctx, lamp);
    else if (role === 'sidecar') sidecar(ctx, lamp);
    else rack(ctx, role, node, lamp);
    if ((status === 'down' && role !== 'reject') || status === 'pending' || status === 'slow') {
      const [px, py] = project(23, 7, 10);
      ellipse(ctx, px, py, 5.6, 5.6, '#262737', lamp, 1);
      if (status === 'down') {
        stroke(ctx, [[px - 2.1, py - 2.1], [px + 2.1, py + 2.1]], lamp, 1.2);
        stroke(ctx, [[px + 2.1, py - 2.1], [px - 2.1, py + 2.1]], lamp, 1.2);
      } else {
        stroke(ctx, [[px, py - 2.8], [px, py], [px + 2.2, py + 1.2]], lamp, 1.2);
      }
    }
    ctx.restore();
  }

  function arrangeRegistry(nodes, width, height) {
    const products = nodes.filter(node => node.role === 'product');
    const directory = nodes.find(node => node.role === 'registry');
    const columns = directory ? Math.max(1, Math.ceil(products.length / 2)) : 1;
    const stacked = columns === 1;
    const mobile = width < 580;
    const unit = Math.max(0.16, Math.min(
      width / (mobile ? (stacked ? 544 : 680) : (stacked ? 663 : 800)),
      height / (stacked ? 308 : 392), 1.28
    ));
    const primary = mobile ? clamp(width / (stacked ? 29 : 33), 9.3, 13.8) :
      clamp(Math.min(height / 17.3, width / (stacked ? 39 : 44)), 12.4, 18);
    const secondary = mobile ? Math.max(8.5, primary - 1.4) : Math.max(11, primary - 2);
    const gap = mobile ? 5 : 9;
    // Reserve a whole caption column beyond the vertical stack. The short
    // heartbeat links occupy the other side of the machines.
    const captionWidth = primary * (stacked ? 7.2 : 6.45) + (mobile ? 6 : 10);
    const margin = Math.max(5, Math.min(width * 0.026, 22));
    const clientX = Math.max(49 * unit + 3, width * (stacked ? 0.096 : 0.067));
    let axisX = width - margin - captionWidth - gap - 47 * unit;
    let lastX = axisX;
    if (!stacked) {
      lastX = width - margin - captionWidth / 2;
      axisX = Math.min(width * (columns > 2 ? 0.475 : 0.56),
        lastX - (columns - 1) * (captionWidth + 4));
    }
    const gatewayX = mix(clientX, axisX, stacked ? 0.435 : 0.47);
    const showSubs = stacked || !mobile;
    const lowerCaption = stacked ? 0 : primary + (showSubs ? secondary + 4 : 0) + 3;
    const topY = 73 * unit + Math.max(5, height * 0.022) + lowerCaption;
    const bottomY = height - Math.max(8, height * 0.039) - 22 * unit - lowerCaption;
    const centerY = (topY + bottomY) / 2;
    const byId = new Map();
    function put(node, x, y, caption, column = 0) {
      if (!node) return;
      const size = node.role === 'gateway' ? unit * 1.035 : unit;
      byId.set(node.id, {node, x, y, size, primary, secondary, showSubs, mobile, crowded: !stacked,
        registryCaption: caption, registryColumn: column});
    }
    const get = role => nodes.find(node => node.role === role);
    put(get('client'), clientX, centerY, get('reject') ? 'terminal-above' : 'below');
    put(get('gateway'), gatewayX, centerY, get('reject') ? 'above' : 'below');
    put(directory, axisX, centerY, 'right');
    products.forEach((node, i) => {
      if (!directory) {
        const y = products.length === 1 ? centerY : mix(topY, bottomY, i / (products.length - 1));
        put(node, axisX, y, 'right');
        return;
      }
      const column = Math.floor(i / 2);
      const x = stacked ? axisX : mix(axisX, lastX, column / Math.max(1, columns - 1));
      put(node, x, i % 2 ? bottomY : topY, stacked ? 'right' : (i % 2 ? 'below' : 'rack-above'), column);
    });
    put(get('reject'), clientX + Math.min(22 * unit, (gatewayX - clientX) * 0.21), bottomY, 'right');
    for (const node of nodes) {
      if (!byId.has(node.id)) put(node, clientX, topY, 'right');
    }
    const items = [...byId.values()];
    return {scene: 'registry', bench: false, items, byId, unit, mobile, width, height,
      registryStacked: stacked, backToFront: items.slice().sort((a, b) => a.y - b.y)};
  }

  function arrange(nodes, scene, width, height) {
    if (scene === 'registry') return arrangeRegistry(nodes, width, height);
    const mobile = width < 580 || width / height < 1.45;
    const count = nodes.length;
    const crowded = count > 8;
    const dense = count > 10;
    const density = dense ? (mobile ? 0.69 : 0.78) : crowded ? 0.85 : 1;
    const bench = scene === 'phone' || scene === 'contract';
    const base = bench ? Math.min(width / 740, height / 132, 1.05) : (mobile ? Math.min(width / 465, height / 295, 1.03) :
      Math.min(width / 740, height / (scene === 'gateway' ? 225 : 312), 1.48)) * density;
    const unit = Math.max(0.17, base);
    const primary = mobile ? clamp(width / 33, 9, 12.2) : clamp(13.1 * Math.min(1.08, unit + 0.1), 10, 15);
    const secondary = mobile ? clamp(primary - 1.2, 8.2, 10.7) : primary - 1.5;
    const showSubs = !(mobile && crowded) && !(dense && height < 410);
    const edgeX = Math.min(width * 0.135, Math.max(47 * unit + 2, primary * 2.45));
    const upper = scene === 'gateway' ? 77 * unit + 6 : 70 * unit + 3;
    const lower = height - 24 * unit - primary * 0.76 - (showSubs ? secondary + 6 : 3);
    const placements = new Map();
    const products = nodes.filter(node => node.role === 'product');
    const find = (role) => nodes.find(node => node.role === role);
    function at(node, nx, ny) {
      if (!node || placements.has(node.id)) return;
      const size = node.role === 'gateway' ? unit * 1.065 : unit;
      placements.set(node.id, {
        node, x: mix(edgeX, width - edgeX, nx), y: mix(upper, Math.max(upper + 1, lower), ny), size,
        primary, secondary, showSubs, mobile, crowded
      });
    }
    const place = (role, nx, ny) => at(find(role), nx, ny);

    function bank(x1, x2, y1, y2, columns) {
      const n = products.length;
      if (!n) return;
      if (n === 1) { at(products[0], mix(x1, x2, 0.62), mix(y1, y2, 0.4)); return; }
      if (n === 2) {
        at(products[0], mix(x1, x2, 0.16), y1);
        at(products[1], x2, y2);
        return;
      }
      if (n === 3) {
        at(products[0], x1, y1);
        at(products[1], x2, mix(y1, y2, 0.44));
        at(products[2], mix(x1, x2, 0.18), y2);
        return;
      }
      const rows = Math.ceil(n / columns);
      const stair = mobile && rows > 2 ? 0.022 : 0.066;
      products.forEach((node, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);
        const across = col / (columns - 1);
        const down = row / Math.max(1, rows - 1);
        at(node, mix(x1, x2, across) + (row % 2 ? 0.015 : 0), mix(y1, y2 - stair, down) + stair * across);
      });
    }

    const many = products.length >= 4;
    if (bench) {
      // Separate consumer/Stub and verifier/provider pairs without taking space from the editors.
      const columns = count === 4 ? [0.065, 0.355, 0.645, 0.935] : [0.10, 0.50, 0.90];
      nodes.forEach((node, i) => at(node, columns[i], i % 2 ? 0.25 : 0.78));
    } else if (scene === 'gateway' && find('inventory') && find('review')) {
      place('client', 0.055, 0.56); place('gateway', 0.42, 0.48);
      at(products[0], 0.77, 0.025); place('inventory', 0.91, 0.48); place('review', 0.77, 0.95);
    } else if (scene === 'gateway') {
      if (many) {
        place('client', 0.025, 0.54); place('gateway', 0.29, 0.44);
        place('reject', 0.29, 0.98); place('order', 0.10, 0.035);
        bank(0.63, 0.94, 0.01, 0.95, 2);
      } else {
        place('client', mobile ? 0.015 : 0.045, 0.55);
        place('gateway', mobile ? 0.37 : 0.40, 0.23);
        place('reject', mobile ? 0.26 : 0.245, 0.98);
        place('order', mobile ? 0.73 : 0.60, 0.94);
        bank(mobile ? 0.77 : 0.69, mobile ? 0.955 : 0.94, 0.025, 0.76, 2);
      }
    } else if (scene === 'scale') {
      place('client', mobile ? 0.015 : 0.04, 0.68);
      place('gateway', many ? 0.26 : 0.36, 0.52);
      place('registry', many ? 0.28 : 0.43, 0.04);
      place('control', many ? 0.25 : 0.42, 0.025);
      bank(many ? 0.61 : 0.70, 0.94, many ? 0.02 : 0.20, 0.90, 2);
    } else if (scene === 'resilience') {
      const basicChain = !find('config') && !find('inventory') && products.length <= 1;
      if (basicChain) {
        place('client', 0.025, 0.68); place('gateway', 0.33, 0.45);
        at(products[0], 0.62, 0.25); place('review', 0.94, 0.61);
      } else {
        place('client', mobile ? 0.003 : 0.015, many || mobile ? 0.76 : 0.67);
        place('gateway', mobile ? (many ? 0.17 : 0.28) : 0.245, many ? 0.44 : (mobile ? 0.51 : 0.48));
        place('config', many ? 0.18 : (mobile ? 0.13 : 0.385), 0.012);
        if (many) {
          const columns = products.length > 6 && !mobile ? 3 : 2;
          bank(columns === 3 ? 0.40 : 0.445, mobile ? 0.706 : 0.725, 0.018, 0.985, columns);
        } else {
          bank(mobile ? 0.55 : 0.54, 0.637, mobile ? 0.28 : 0.37, 0.955, 2);
        }
        place('inventory', mobile ? 0.963 : 0.91, 0.23);
        place('review', 0.985, 0.77);
      }
    } else if (scene === 'mesh') {
      const proxy = find('sidecar');
      place('client', 0.022, 0.69);
      place('gateway', proxy ? 0.265 : 0.34, 0.53);
      place('sidecar', 0.55, 0.59);
      place('control', proxy ? 0.46 : 0.48, 0.04);
      place('config', proxy ? 0.46 : 0.48, 0.04);
      place('v1', 0.805, 0.235); place('v2', 0.955, 0.805);
    }
    const remaining = nodes.filter(node => !placements.has(node.id));
    if (placements.size === 0) {
      const cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(count * width / height))));
      const rows = Math.ceil(count / cols);
      remaining.forEach((node, index) => {
        const nx = cols > 1 ? (index % cols) / (cols - 1) : 0.5;
        const ny = rows > 1 ? Math.floor(index / cols) / (rows - 1) : 0.5 - 0.14 * Math.sin(nx * Math.PI);
        at(node, nx, ny);
      });
    } else {
      // Unknown extensions occupy the roomiest unused position on the board.
      for (const node of remaining) {
        let best = [0.5, 0.5, -1];
        for (const nx of [0.05, 0.27, 0.5, 0.73, 0.95]) {
          for (const ny of [0.05, 0.48, 0.95]) {
            const x = mix(edgeX, width - edgeX, nx);
            const y = mix(upper, lower, ny);
            const clearance = Math.min(...Array.from(placements.values(), p => Math.hypot(x - p.x, (y - p.y) * 1.15)));
            if (clearance > best[2]) best = [nx, ny, clearance];
          }
        }
        at(node, best[0], best[1]);
      }
    }
    const items = Array.from(placements.values());
    return {scene, bench, items, byId: placements, backToFront: items.slice().sort((a, b) => a.y - b.y), unit, mobile, width, height};
  }

  function drawFloor(ctx, width, height, unit) {
    ctx.fillStyle = gradient(ctx, 0, 0, 0, height, '#191b2e', '#161829');
    ctx.fillRect(0, 0, width, height);
    glow(ctx, width * 0.52, height * 0.50, width * 0.62, height * 0.85, '#4f4b78', 0.38);
    glow(ctx, width * 0.32, height * 0.65, width * 0.41, height * 0.74, '#303b59', 0.17);
    const grid = ctx.createLinearGradient(0, 0, 0, height);
    grid.addColorStop(0, '#8481ad02');
    grid.addColorStop(0.16, '#8481ad13');
    grid.addColorStop(0.48, '#9692bf25');
    grid.addColorStop(0.78, '#8b88af1c');
    grid.addColorStop(1, '#8481ad02');
    const step = clamp(27 * unit, 16, 38);
    for (const direction of [-1, 1]) {
      const drift = direction * slope * width;
      ctx.beginPath();
      for (let y = -Math.abs(drift) - step; y < height + Math.abs(drift) + step; y += step) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y + drift);
      }
      ctx.lineWidth = 0.7;
      ctx.strokeStyle = grid;
      ctx.stroke();
    }
    // Engraved alignment marks sit in the floor and have no connection to the graph.
    const marks = [[0.08, 0.23], [0.17, 0.86], [0.33, 0.12], [0.56, 0.66], [0.73, 0.86], [0.94, 0.17]];
    for (const [nx, ny] of marks) {
      const x = width * nx, y = height * ny, r = 3.1 * Math.min(unit, 1);
      stroke(ctx, [[x - r, y - r * slope], [x + r, y + r * slope]], '#9a9ab233', 0.7);
      stroke(ctx, [[x - r, y + r * slope], [x + r, y - r * slope]], '#9a9ab233', 0.7);
    }
  }

  function shadeGround(ctx, item) {
    const {node, x, y, size} = item;
    const color = palette[node.role] || palette.product;
    const muted = ['down', 'pending', 'muted'].includes(node.status);
    glow(ctx, x + 5 * size, y + 6 * size, 58 * size, 21 * size, '#050616', 0.92);
    glow(ctx, x + 11 * size, y + 5.8 * size, 54 * size, 20 * size, '#08091a', 0.65);
    glow(ctx, x - 2 * size, y + 2.8 * size, 65 * size, 27 * size, color, muted && node.role !== 'reject' ? 0.07 : 0.24);
  }

  function diameter(role) {
    if (role === 'order' || role === 'inventory') return 44;
    if (role === 'config' || role === 'sidecar') return 46;
    if (role === 'registry') return 59;
    return role === 'gateway' || role === 'product' || role === 'v1' || role === 'v2' ? 73 : 64;
  }

  function rectOverlap(a, b) {
    return Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) *
      Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  }

  function fitText(ctx, text, limit) {
    const str = String(text == null ? '' : text);
    if (ctx.measureText(str).width <= limit) return str;
    const chars = Array.from(str);
    while (chars.length && ctx.measureText(chars.join('') + '…').width > limit) chars.pop();
    return chars.join('') + '…';
  }

  function labelNodes(ctx, geometry) {
    const {items, width, height} = geometry;
    const registration = geometry.scene === 'registry';
    const used = [];
    const backRack = geometry.scene === 'gateway' && geometry.backToFront.find(item => item.node.role === 'product');
    const bodies = items.map(item => {
      const z = diameter(item.node.role) * item.size;
      return {x: item.x - 43 * item.size, y: item.y - z, w: 86 * item.size, h: z + 17 * item.size};
    });
    for (const item of items) {
      const {node, size, mobile, primary, secondary, crowded} = item;
      let title = node.label || node.id;
      let sub = node.sub || '';
      const server = registration && node.role === 'product';
      if (server) title = String(title).replace(/^商品(?:实例)?\s*(\d+)$/, (_, number) => '商品服务器 ' + number.padStart(2, '0'));
      if (mobile) {
        if (title === '商城客户端' && !registration) title = '客户端';
        if (title === 'API 网关' && crowded) title = '网关';
        if (node.role === 'control' && String(title).startsWith('HPA')) title = 'HPA';
        sub = String(sub).replace(/请求\s*\/\s*秒/g, '次/秒');
      }
      if (!item.showSubs && node.role === 'product') {
        const version = String(sub).match(/^v\d+/);
        if (version) title = (mobile ? title.replace(/^商品\s+/, '商品') : title) + '·' + version[0];
      }
      const bodyFont = '620 ' + primary + 'px ' + fontFamily;
      const subFont = '450 ' + secondary + 'px ' + fontFamily;
      const rightCaption = item.registryCaption === 'right';
      let limit = mobile ? (crowded ? Math.max(43, width / 5.7) : Math.max(59, width / 4.15)) : Math.min(167, width / (crowded ? 6.8 : 4.8));
      if (registration) {
        limit = rightCaption ? Math.max(60, width - item.x - 50 * size - (mobile ? 8 : 16)) :
          Math.max(primary * 7.2 + 8, width / (crowded ? 6.2 : 5));
      }
      ctx.font = bodyFont;
      if (!server) title = fitText(ctx, title, limit - 8);
      const dotWidth = mobile && crowded ? 6 : 9;
      const titleWidth = dotWidth + ctx.measureText(title).width;
      ctx.font = subFont;
      sub = item.showSubs && sub ? fitText(ctx, sub, limit) : '';
      const subWidth = sub ? ctx.measureText(sub).width : 0;
      const groupWidth = Math.max(titleWidth, subWidth + (rightCaption && sub ? dotWidth : 0));
      const lineGap = mobile ? 2 : 3;
      const bodyH = primary + (sub ? lineGap + secondary : 0);
      // The lower rack's live traffic passes below the back rack on a shallow
      // desktop stage. Put the back rack's caption beside it, clear of that lane.
      const toSide = item === backRack && width - item.x > 48 * size + groupWidth + 5;
      const x0 = rightCaption ? item.x + 47 * size + (mobile ? 5 : 9) + groupWidth / 2 :
        toSide ? item.x + 46 * size + groupWidth / 2 : item.x;
      let y0 = toSide ? item.y - 41 * size : item.y + 21.8 * size + (mobile ? 1.5 : 3);
      if (rightCaption) y0 = item.y - 18 * size - bodyH / 2;
      if (item.registryCaption === 'above') y0 = item.y - 35 * size - bodyH - 2;
      if (item.registryCaption === 'terminal-above') y0 = item.y - 59 * size - bodyH - 3;
      if (item.registryCaption === 'rack-above') y0 = item.y - 73 * size - bodyH - 3;
      const xs = [0, -groupWidth * 0.27, groupWidth * 0.27, -groupWidth * 0.58, groupWidth * 0.58];
      let place = null;
      for (const dy of [0, -3 * size, 4 * size, 9 * size]) {
        for (const dx of xs) {
          const x = clamp(x0 + dx, groupWidth / 2 + 3, width - groupWidth / 2 - 3);
          const y = clamp(y0 + dy, 1, Math.max(1, height - bodyH - 2));
          const rect = {x: x - groupWidth / 2 - 1, y, w: groupWidth + 2, h: bodyH};
          const overlap = bodies.reduce((sum, body, i) => sum + (items[i] === item ? 0 : rectOverlap(rect, body)), 0);
          const collision = used.reduce((sum, other) => sum + rectOverlap(rect, other), 0);
          const score = 4 * overlap + 15 * collision + Math.abs(dx) * 0.6 + Math.abs(dy);
          if (!place || score < place.score) place = {x, y, rect, score};
        }
      }
      used.push(place.rect);
      const centerY = place.y + primary * 0.54;
      const left = place.x - (rightCaption ? groupWidth : titleWidth) / 2;
      const tone = statusTones[node.status] || statusTones.up;
      ctx.save();
      ctx.textBaseline = 'middle';
      ctx.shadowColor = '#111321';
      ctx.shadowBlur = 3;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1b1d30d9';
      ctx.lineWidth = mobile ? 2 : 3;
      ctx.font = bodyFont;
      ctx.textAlign = 'left';
      ctx.strokeText(title, left + dotWidth, centerY);
      ctx.fillStyle = (node.status === 'down' && node.role !== 'reject') || node.status === 'muted' ? '#c2c0d2' : '#f1eefb';
      ctx.fillText(title, left + dotWidth, centerY);
      ctx.shadowBlur = 0;
      const dotX = left + (mobile && crowded ? 1.7 : 2.25);
      if (node.status === 'down') {
        stroke(ctx, [[dotX - 1.7, centerY - 1.7], [dotX + 1.7, centerY + 1.7]], tone, 1.35);
        stroke(ctx, [[dotX - 1.7, centerY + 1.7], [dotX + 1.7, centerY - 1.7]], tone, 1.35);
      } else {
        ellipse(ctx, dotX, centerY, mobile && crowded ? 1.55 : 2.05, mobile && crowded ? 1.55 : 2.05, tone);
      }
      if (sub) {
        ctx.textAlign = rightCaption ? 'left' : 'center';
        ctx.font = subFont;
        const sy = place.y + primary + lineGap + secondary * 0.55;
        ctx.strokeStyle = '#1b1d30d9';
        ctx.lineWidth = mobile ? 2 : 3;
        const subX = rightCaption ? left + dotWidth : place.x;
        ctx.strokeText(sub, subX, sy);
        ctx.fillStyle = '#bcb9d0';
        ctx.fillText(sub, subX, sy);
      }
      ctx.restore();
    }
  }

  const toAxes = ([x, y]) => [(x + y / slope) / 2, (x - y / slope) / 2];
  const fromAxes = ([u, v]) => [u + v, (u - v) * slope];
  const distance = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  function nearestOnSegment(x, y, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    return [a[0] + dx * t, a[1] + dy * t];
  }

  // These coordinates lie on the plinths of the original isometric machines.
  // Both branches share the same physical decision point on the low gate.
  const ports = {client: [29, -2], gateway: [-3, 8], reject: [3, 24]};
  function portPosition(item) {
    const [x, y] = project(...(ports[item.node.role] || [-4, 22]));
    return [item.x + x * item.size, item.y + y * item.size];
  }

  function registryPath(start, finish, geometry) {
    const u = geometry.unit;
    // The terminal sends from its right-hand socket. The registry and every
    // rack receive on matching left-front sockets, exposed beside their cases.
    const sockets = {client: 27, gateway: -6, registry: -39, product: -39, reject: -13};
    const socket = item => [item.x + (sockets[item.node.role] || 0) * item.size, item.y + 6 * u];
    const a = socket(start), b = socket(finish);
    const roles = [start.node.role, finish.node.role];
    const rack = roles.includes('product') ? (start.node.role === 'product' ? start : finish) : null;
    const directory = geometry.items.find(item => item.node.role === 'registry');
    if (!rack || !directory) return [a, b];
    const server = socket(rack), registry = socket(directory);
    const upper = rack.y < directory.y;
    const middleLane = upper ? (rack.y + 23 * u + directory.y - 57 * u) / 2 :
      (directory.y + 23 * u + rack.y - 70 * u) / 2;
    if (roles.includes('registry')) {
      if (!rack.registryColumn) return [a, b];
      const lane = middleLane + (upper ? -2.4 : 2.4) * u;
      const way = [server, [server[0], lane], [registry[0], lane], registry];
      return start === rack ? way : way.reverse();
    }
    if (!roles.includes('gateway')) return [a, b];
    const gate = start.node.role === 'gateway' ? start : finish;
    const source = socket(gate);
    const span = server[0] - source[0];
    const fork = [source[0] + Math.min(45 * u, span * 0.28), source[1]];
    let way;
    if (!rack.registryColumn) {
      const ramp = Math.min((server[0] - fork[0]) * 0.76, Math.abs(server[1] - source[1]) / 0.77);
      way = [source, fork, [fork[0] + ramp, server[1]], server];
    } else {
      const lane = middleLane + (upper ? 2.4 : -2.4) * u;
      const firstTurn = [fork[0] + Math.min(46 * u, (server[0] - fork[0]) * 0.29), lane];
      way = [source, fork, firstTurn, [server[0] - 18 * u, lane], server];
    }
    return start === gate ? way : way.reverse();
  }

  function routePoints(start, finish, geometry, kind) {
    if (geometry.scene === 'registry') return registryPath(start, finish, geometry);
    const a = portPosition(start);
    const b = portPosition(finish);
    if (geometry.bench) {
      // A shallow path leaves room above the machines' ports for the full bounce.
      const y = Math.min(a[1], b[1]) - 9 * geometry.unit;
      return [a, [a[0] + (a[1] - y) / slope, y], [b[0] - (b[1] - y) / slope, y], b];
    }
    if (geometry.scene === 'gateway' && start.node.role === 'gateway' && finish.node.role === 'product') {
      // Fan out from the gate in screen-depth order. Two independently chosen
      // shortest isometric routes can cross and make their destinations ambiguous.
      const dy = b[1] - a[1], ramp = Math.abs(dy) / slope;
      const straight = b[0] - a[0] - ramp;
      if (straight > 8 * geometry.unit) {
        if (dy < 0) {
          const y = b[1] - Math.min(20 * geometry.unit, straight * slope / 3);
          return [a, [a[0] + (a[1] - y) / slope, y], [b[0] - (b[1] - y) / slope, y], b];
        }
        const x = a[0] + straight * 0.56;
        return [a, [x, a[1]], [x + ramp, b[1]], b];
      }
    }
    const [u1, v1] = toAxes(a), [u2, v2] = toAxes(b);
    const axesPaths = [[[u2, v1]], [[u1, v2]]];
    for (const fraction of [0.24, 0.5, 0.76]) {
      const u = mix(u1, u2, fraction), v = mix(v1, v2, fraction);
      axesPaths.push([[u, v1], [u, v2]], [[u1, v], [u2, v]]);
    }
    const candidates = axesPaths.map(p => [a, ...p.map(fromAxes), b]);
    // A short transverse run also lets a steep branch clear the edge of a narrow screen.
    for (const fraction of [0.28, 0.52, 0.75]) {
      const x = mix(a[0], b[0], fraction);
      candidates.push([a, [x, a[1]], [x + (b[1] - a[1]) * 0.34, b[1]], b]);
    }
    const steep = Math.abs(b[1] - a[1]) > 0.74 * Math.abs(b[0] - a[0]);
    if (steep) {
      const turn = Math.min(27 * geometry.unit, distance(a, b) * 0.16);
      const dy = Math.sign(b[1] - a[1]) * turn * slope;
      for (const sign of [-1, 1]) {
        candidates.push([a, [a[0] + sign * turn, a[1] + dy], [b[0] - sign * turn, b[1] - dy], b]);
      }
    }
    let best;
    const unit = geometry.unit;
    for (const candidate of candidates) {
      const points = candidate.filter((p, i) => !i || distance(p, candidate[i - 1]) > 1);
      if (points.length < 2) continue;
      let cost = points.length * 2.5 * unit;
      for (let i = 1; i < points.length; i++) {
        const prior = points[i - 1], next = points[i];
        cost += distance(prior, next) * 0.13;
        const outside = Math.max(0, 7 - next[0], next[0] - geometry.width + 7, 7 - next[1], next[1] - geometry.height + 7);
        cost += outside * 14;
        for (const item of geometry.items) {
          if (item === start || item === finish) continue;
          const [px, py] = nearestOnSegment(item.x, item.y, prior, next);
          const clearance = Math.hypot(item.x - px, (item.y - py) * 1.8);
          cost += Math.max(0, 52 * item.size - clearance) * 2.8;
        }
      }
      // Isometric runs remain the usual choice. Prefer the upper circuit for control traffic.
      const index = candidates.indexOf(candidate);
      if (index >= axesPaths.length) cost += (steep && index >= axesPaths.length + 3 ? 4 : 13) * unit;
      const reach = points.slice(1, -1).reduce((sum, p) => sum + (p[1] - (a[1] + b[1]) / 2), 0);
      cost += (kind === 'control' ? 0.018 : -0.009) * reach;
      if (!best || cost < best.cost) best = {points, cost};
    }
    return best ? best.points : [a, b];
  }

  function soften(points, radius) {
    const result = [points[0]];
    for (let i = 1; i < points.length - 1; i++) {
      const a = points[i - 1], b = points[i], c = points[i + 1];
      const before = distance(a, b), after = distance(b, c);
      const r = Math.min(radius, before / 3, after / 3);
      if (r < 0.1) continue;
      const left = [mix(b[0], a[0], r / before), mix(b[1], a[1], r / before)];
      const right = [mix(b[0], c[0], r / after), mix(b[1], c[1], r / after)];
      result.push(left);
      for (const t of [0.25, 0.5, 0.75, 1]) {
        const s = 1 - t;
        result.push([s * s * left[0] + 2 * s * t * b[0] + t * t * right[0],
          s * s * left[1] + 2 * s * t * b[1] + t * t * right[1]]);
      }
    }
    result.push(points[points.length - 1]);
    return result;
  }

  function planEdges(edges, geometry) {
    const routes = [];
    for (const edge of edges) {
      const from = geometry.byId.get(edge.from), to = geometry.byId.get(edge.to);
      if (!from || !to || from === to) continue;
      const kind = edgeTones[edge.kind] ? edge.kind : 'flow';
      const weight = clamp(Number.isFinite(Number(edge.weight)) ? Number(edge.weight) : 0, 0, 1);
      const inactive = status => status === 'down' || (status === 'pending' && kind !== 'control') || status === 'muted';
      const isFailure = kind === 'blocked' && to.node.status === 'down';
      const active = weight > 0 && kind !== 'idle' && !inactive(from.node.status) && (!inactive(to.node.status) || isFailure);
      const points = soften(routePoints(from, to, geometry, kind), 5.5 * geometry.unit);
      const lengths = [0];
      for (let i = 1; i < points.length; i++) lengths.push(lengths[i - 1] + distance(points[i - 1], points[i]));
      const length = lengths[lengths.length - 1];
      if (length < 1) continue;
      const seed = hash(edge.from + '/' + edge.to + '/' + kind);
      routes.push({points, lengths, length, weight, kind, active, seed, from, to, isFailure});
    }
    return routes.sort((a, b) => (a.active - b.active) || ((b.kind === 'control') - (a.kind === 'control')));
  }

  function along(route, fraction) {
    const target = clamp(fraction, 0, 1) * route.length;
    let i = 1;
    while (i < route.lengths.length - 1 && route.lengths[i] < target) i++;
    const amount = (target - route.lengths[i - 1]) / (route.lengths[i] - route.lengths[i - 1] || 1);
    const a = route.points[i - 1], b = route.points[i];
    return [mix(a[0], b[0], amount), mix(a[1], b[1], amount)];
  }

  function endPort(route) {
    const {to} = route;
    for (let t = 0.99; t >= 0.35; t -= 0.014) {
      const [x, y] = along(route, t);
      // Slightly outside the physical node's diamond-shaped footprint.
      if (Math.abs(x - to.x) / (53 * to.size) + Math.abs(y - to.y) / (27 * to.size) > 1.13) return t;
    }
    return 0.68;
  }

  function drawRoutes(ctx, routes, geometry) {
    ctx.save();
    const gateway = geometry.scene === 'gateway';
    const u = clamp(geometry.unit, 0.65, 1.4);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    for (const route of routes) {
      const {points, kind, active, weight} = route;
      const toProxy = geometry.scene === 'mesh' && route.to.node.role === 'sidecar';
      const neutral = kind === 'flow' && (geometry.bench || route.from.node.role === 'client' || toProxy);
      const toCanary = kind === 'flow' && geometry.scene === 'mesh' && route.to.node.role === 'v2';
      const color = neutral ? '#b9aedf' : toCanary ? '#f5ca77' : edgeTones[kind];
      const control = kind === 'control';
      ctx.setLineDash([]);
      stroke(ctx, points, active ? '#141625c9' : '#212338', (control ? 2.8 : 4.5 + weight) * u);
      if (active && !control) {
        stroke(ctx, points, tint(color, 0.095 + 0.055 * weight), (5.3 + 2.8 * weight) * u);
        stroke(ctx, points, tint(color, 0.22 + 0.065 * weight), (2.55 + 1.3 * weight) * u);
      }
      if (control || !active) ctx.setLineDash((control ? [3.1, 4.1] : [2.2, 4.4]).map(d => d * u));
      stroke(ctx, points, tint(active || control || kind === 'blocked' ? color : edgeTones.idle,
        active ? (control ? 0.8 : 0.84 + 0.14 * weight) : (kind === 'blocked' ? 0.64 : 0.49)),
        (active ? (control ? 1.1 : 0.9 + weight * 0.66) : 0.8) * u);
      ctx.setLineDash([]);
      if (geometry.scene === 'registry' && control && route.length > 20 * u) {
        const t = route.from.node.role === 'product' && route.from.registryColumn ? 0.32 : 0.5;
        const [x, y] = along(route, t);
        const [nextX, nextY] = along(route, t + 0.012);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.atan2(nextY - y, nextX - x));
        const arrow = [[-3.8 * u, -3.1 * u], [0.75 * u, 0], [-3.8 * u, 3.1 * u]];
        stroke(ctx, arrow, '#24253a', 3.4 * u);
        stroke(ctx, arrow, active ? '#e4dcff' : '#b4a8d6', 1.65 * u);
        ctx.restore();
      }
      if (gateway) continue;
      route.port = endPort(route);
      if ((!active && kind !== 'blocked') || control) continue;
      if (kind === 'blocked') {
        const [x, y] = along(route, route.port);
        const r = 3.45 * u;
        ellipse(ctx, x, y, 4.75 * u, 4.75 * u, '#332832', tint(color, 0.83), 0.75 * u);
        stroke(ctx, [[x - r / 2, y - r / 2], [x + r / 2, y + r / 2]], '#ffd5ba', 1.05 * u);
        stroke(ctx, [[x - r / 2, y + r / 2], [x + r / 2, y - r / 2]], '#ffd5ba', 1.05 * u);
      } else if (route.length > 136 * u) {
        const t = 0.46 + route.seed * 0.13;
        const [x, y] = along(route, t);
        const [nx, ny] = along(route, t + 0.01);
        const angle = Math.atan2(ny - y, nx - x);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        stroke(ctx, [[-2.2 * u, -2.2 * u], [0.9 * u, 0], [-2.2 * u, 2.2 * u]], neutral ? '#ddd6f5' : '#c0f4df', 1 * u);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  function layer(canvas, width, height) {
    const surface = canvas.ownerDocument ? canvas.ownerDocument.createElement('canvas') : new OffscreenCanvas(width, height);
    surface.width = width;
    surface.height = height;
    return {surface, ctx: surface.getContext('2d')};
  }

  function fitLayer(target, width, height, sx, sy) {
    const ctx = target.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    return ctx;
  }

  function drawMachine(canvas, state, art, item, sx, sy) {
    const {size, node} = item;
    const key = [node.role, node.status, size].join('/');
    let sprite = state.sprites.get(key);
    if (!sprite) {
      const w = 115 * size, h = 108 * size, originX = 57.5 * size, originY = 78 * size;
      const tile = layer(canvas, Math.ceil(w * sx), Math.ceil(h * sy));
      tile.ctx.setTransform(tile.surface.width / w, 0, 0, tile.surface.height / h, 0, 0);
      machine(tile.ctx, {node, x: originX, y: originY, size});
      sprite = {surface: tile.surface, w, h, originX, originY};
      state.sprites.set(key, sprite);
    }
    art.save();
    if (node.status === 'muted') art.globalAlpha = 0.62;
    if (node.status === 'pending') art.globalAlpha = 0.76;
    if (node.status === 'down' && node.role !== 'reject') art.globalAlpha = 0.58;
    art.drawImage(sprite.surface, item.x - sprite.originX, item.y - sprite.originY, sprite.w, sprite.h);
    art.restore();
  }

  function drawStage(canvas, sceneId, model, clockSeconds, manual = []) {
    if (!canvas || typeof canvas.getContext !== 'function') return;
    const rect = typeof canvas.getBoundingClientRect === 'function' ? canvas.getBoundingClientRect() : {};
    const width = rect.width || canvas.clientWidth || 840;
    const height = rect.height || canvas.clientHeight || 345;
    const dpr = clamp(Number(window.devicePixelRatio) || 1, 1, 2);
    const pixelW = Math.max(1, Math.round(width * dpr)), pixelH = Math.max(1, Math.round(height * dpr));
    const sx = pixelW / width, sy = pixelH / height;
    if (canvas.width !== pixelW) canvas.width = pixelW;
    if (canvas.height !== pixelH) canvas.height = pixelH;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const nodes = model && Array.isArray(model.nodes) ? model.nodes : [];
    const edges = model && Array.isArray(model.edges) ? model.edges : [];
    const flights = window.Lab.requestBalls;
    const sizeKey = [width, height, pixelW, pixelH].join('/');
    let state = stages.get(canvas);
    if (!state || state.sizeKey !== sizeKey) {
      state = {sizeKey, ground: layer(canvas, pixelW, pixelH), glass: layer(canvas, pixelW, pixelH), sprites: new Map(), history: new WeakMap()};
      stages.set(canvas, state);
    }
    const nodeKey = JSON.stringify([sceneId, nodes.map(n => [n.id, n.role, n.label, n.sub, n.status])]);
    const newNodes = state.nodeKey !== nodeKey;
    if (newNodes) {
      state.nodeKey = nodeKey;
      state.geometry = arrange(nodes, sceneId, width, height);
      const art = fitLayer(state.glass, pixelW, pixelH, sx, sy);
      labelNodes(art, state.geometry);
    }
    const edgeKey = JSON.stringify(edges.map(e => [e.from, e.to, e.kind, e.weight]));
    if (newNodes || state.edgeKey !== edgeKey) {
      state.edgeKey = edgeKey;
      const base = fitLayer(state.ground, pixelW, pixelH, sx, sy);
      const geometry = state.geometry;
      drawFloor(base, width, height, geometry.unit);
      for (const item of geometry.items) shadeGround(base, item);
      state.routes = planEdges(edges, geometry);
      drawRoutes(base, state.routes, geometry);
      geometry.connections = new Map(nodes.map(node => [node.id, new Map()]));
      for (const route of state.routes) geometry.connections.get(route.from.node.id).set(route.to.node.id, route);
      geometry.pointAt = along;
    }
    // Retain the departure geometry for requests still airborne when the topology changes.
    // Weak keys let expired batches and their old paths be collected.
    for (const batch of [model.batch, ...manual.map(item => item.batch)]) {
      if (batch && !state.history.has(batch)) state.history.set(batch, state.geometry);
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(state.ground.surface, 0, 0);
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    const seconds = Number.isFinite(clockSeconds) ? clockSeconds : 0;
    const balls = flights.atTime(state.geometry, model, seconds, manual, state.history);
    for (const ball of balls) flights.shadow(ctx, ball);
    function drawPacket(packet) {
      if (packet.isHeartbeat) flights.heart(ctx, packet);
      else flights.sphere(ctx, packet);
    }
    let next = 0;
    for (const item of state.geometry.backToFront) {

  const heartbeatTravel = 0.58;

  const mono = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';
  const bounded = (n, a, b) => Math.min(b, Math.max(a, n));
  const mix = (a, b, t) => a + (b - a) * t;
  const unitInterval = t => bounded(t, 0, 1);

    neutral: ['#ffffff', '#e0e0f5', '#afaed6', '#706f9a', '#43445e'],
    pass: ['#f4fff1', '#a9f7d4', '#60d9ae', '#328f80', '#20534f'],
    canary: ['#fffbe0', '#ffe6a4', '#f0be62', '#b98738', '#795730'],
    stop: ['#fff3d8', '#ffbaa4', '#ff8f7a', '#c45959', '#713e43'],

    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);

    ctx.ellipse(x, y, rx, ry, 0, 0, 2 * Math.PI);

    ctx.beginPath();
    points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));

    if (model.batch) collect(model.batch, seconds - model.batch.second);

    ctx.strokeStyle = '#fff2f2';
    ctx.lineWidth = 1.2;

    ctx.restore();

    const caption = (probe ? '探针' : '#' + ball.request.index) +

(() => {
  'use strict';
  // Capture the pristine page before adding a running simulation to the DOM.

  const offlineSource = isSourcePreview ? null : '<!doctype html>\n' + document.documentElement.outerHTML;
  const { escape, icon } = Lab.ui;
  const topics = Lab.topics;
  const ids = Lab.story.map(scene => scene.id);

  const seenManualBatches = new WeakSet();

    pressedButton = null,
    pointerRelease = 0,
    refreshFrame = 0,

  const openingSpeed = (sceneId) => Lab.scenes[sceneId].defaultSpeed ?? 1;
  const numerals = ['一', '二', '三', '四', '五'];

      'textarea,input:not([type=button]):not([type=checkbox]):not([type=radio]),select,[contenteditable=true]'
